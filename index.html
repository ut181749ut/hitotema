<style>
  :root {

  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141d;

      --surface-2: #212536;
      --border: #2e3348;
      --text: #edeef5;
      --text-dim: #9498ae;
      --accent: #f2b705;
      --accent-strong: #ffce33;
      --accent-ink: #1c1500;
      --teal: #34d6ae;
      --danger: #ff7a72;
      --danger-bg: #3a2020;
      --privacy: #b9a3ff;
      --privacy-bg: #2a2545;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12141d;
    --surface: #191c28;
    --surface-2: #212536;
    --border: #2e3348;
    --text: #edeef5;

  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {

  body {
    background: var(--bg);

    font-family: "IBM Plex Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    padding-inline: 0;
  }

  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  a { color: inherit; }

  h1, h2, h3, .display {
    font-family: "IBM Plex Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 700;
    text-wrap: balance;
    margin: 0;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    background: var(--surface-2);
    color: var(--text);
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-accent:hover:not(:disabled) { background: var(--accent-strong); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-small { padding: 6px 12px; font-size: 12.5px; }

  input, textarea, select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
  }
  textarea { min-height: 110px; resize: vertical; }

  label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 0.02em; }
  .field { margin-bottom: 16px; }

  /* ---------- shell ---------- */
  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 20px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
  }
  .wordmark {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 700;
    text-transform: lowercase;
    font-size: 22px;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .wordmark span { color: var(--accent); }

  nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.tabs a {
    display: block;
    text-decoration: none;
    font-size: 13.5px;

    padding: 8px 12px;
    border-radius: var(--radius);
    border-bottom: 2px solid transparent;
  }
  nav.tabs a.active { color: var(--text); border-bottom-color: var(--accent); }
  nav.tabs a:hover { color: var(--text); }

  .account-wrap { position: relative; }
  .account-btn {
    display: flex;
    align-items: center;
    gap: 8px;

    border: 1px solid var(--border);
    padding: 6px 12px 6px 6px;
  }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    flex-shrink: 0;
  }
  .account-btn .who { text-align: left; line-height: 1.25; }
  .account-btn .who .name { font-size: 12.5px; font-weight: 600; }
  .account-btn .who .bal { font-size: 11px; color: var(--text-dim); }
  .account-btn.is-guest {
    background: var(--accent);
    border-color: var(--accent);
    padding: 8px 16px;
  }
  .account-btn.is-guest .login-label {
    color: var(--accent-ink);
    font-size: 13px;
    font-weight: 600;
  }

  .account-panel {
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    width: 300px;
    max-width: calc(100vw - 32px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    padding: 8px;
    z-index: 30;

  .account-panel .hint-line {
    font-size: 11.5px;
    color: var(--text-dim);
    padding: 6px 8px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .account-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: transparent;
    text-align: left;
    padding: 8px;
    border-radius: 6px;
  }
  .account-row:hover { background: var(--surface-2); }
  .account-row.current { background: var(--surface-2); }
  .account-row .who { flex: 1; }
  .account-row .name { font-size: 13px; font-weight: 600; }
  .account-row .addr { font-size: 11px; color: var(--text-dim); }
  .account-row .bal { font-size: 12px; }

  .demo-banner {
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 8px 20px;
    text-align: center;
  }
  .demo-banner strong { color: var(--text); }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-size: 28px; font-weight: 600; margin-bottom: 6px; }
  .page-head .sub { color: var(--text-dim); font-size: 14px; max-width: 60ch; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 200px; }

  /* ---------- 検索ページの検索バー ---------- */
  .toolbar {
    display: flex;
    align-items: stretch;
    margin-bottom: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .toolbar input[type="search"] {
    border: none;
    border-radius: 0;
    background: transparent;
    flex: 1;
    min-width: 0;
    padding-left: 20px;
  }
  .toolbar input.loc-input {
    border: none;
    border-radius: 0;
    background: transparent;
    border-left: 1px solid var(--border);
    flex: 0 1 220px;
    min-width: 0;
  }
  .toolbar input[type="search"]:focus-visible,
  .toolbar input.loc-input:focus-visible { outline-offset: -2px; }
  .loc-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    max-height: 240px;
    overflow-y: auto;
    z-index: 50;
  }
  .loc-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 400;
    color: var(--text);
  }
  .loc-dropdown button:hover { background: var(--surface-2); }
  .loc-dropdown-sep {
    height: 1px;
    margin: 4px 0;
    background: var(--border);
  }
  @media (max-width: 480px) {
    .toolbar { border-radius: var(--radius); flex-wrap: wrap; }
    .toolbar input.loc-input { flex-basis: 100%; border-left: none; border-top: 1px solid var(--border); }
  }
  .toolbar-search-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    padding: 0;
    flex-shrink: 0;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 0;
  }
  .toolbar-search-btn:hover { background: var(--accent-strong); }
  .search-page-head { text-align: center; }
  .search-page-head h1 { margin-bottom: 0; }
  .search-hero-wrap {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .toolbar-lg { box-shadow: 0 6px 18px rgba(0,0,0,0.10); }
  .toolbar-lg input[type="search"],
  .toolbar-lg input.loc-input {
    padding-top: 16px;
    padding-bottom: 16px;
    font-size: 16px;
  }
  .toolbar-lg input[type="search"] { padding-left: 22px; }
  .toolbar-lg .toolbar-search-btn { width: 58px; }
  .search-filters {
    display: flex;
    gap: 14px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .search-filters .field {
    flex: 1 1 160px;
    min-width: 140px;
    margin-bottom: 0;
  }

  /* datetime-local入力(投稿ページの勤務日時)を大きく、タップしやすく表示する */
  input[type="datetime-local"] {
    font-size: 16px;
    padding: 13px 14px;
  }
  input[type="datetime-local"]::-webkit-calendar-picker-indicator {
    padding: 6px;
    margin-right: -2px;
    transform: scale(1.5);
    transform-origin: right center;
    cursor: pointer;
  }
  input[type="datetime-local"]::-webkit-datetime-edit {
    font-size: 15.5px;
  }

  /* ---------- 検索ページの独自カレンダー(勤務日) ---------- */
  .date-field { position: relative; }
  .date-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    text-align: left;
  }
  .date-btn svg { flex-shrink: 0; color: var(--text-dim); }
  #search-date-display.is-placeholder { color: var(--text-dim); }
  .date-calendar {
    position: absolute;
    z-index: 60;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 16px 36px rgba(0,0,0,0.2);
    padding: 24px;
    width: 380px;
    max-width: 100%;
    display: flex;
    flex-direction: column;
  }
  .date-calendar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .date-calendar-head .ym { font-weight: 600; font-size: 19px; }
  .date-calendar-head button {
    background: transparent;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    cursor: pointer;
  }
  .date-calendar-head button:hover { background: var(--surface-2); }
  .date-calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
    text-align: center;
  }
  .date-calendar-grid .dow {
    font-size: 13.5px;
    color: var(--text-dim);
    padding-bottom: 10px;
  }
  .date-calendar-grid button.day {
    aspect-ratio: 1;
    width: 100%;
    min-width: 0;
    border: none;
    background: transparent;
    border-radius: 50%;
    font-size: 16px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .date-calendar-grid button.day:not([disabled]):hover { background: var(--surface-2); }
  .date-calendar-grid button.day.selected { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .date-calendar-grid button.day.today:not(.selected) { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .date-calendar-grid button.day.other-month { color: var(--text-dim); opacity: 0.35; cursor: default; }
  .date-calendar-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* ---------- 求人一覧ページの表示切り替え ---------- */
  .list-filter { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .list-filter label { margin: 0; font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .list-filter select { width: auto; min-width: 160px; }

  .fab-post {
    position: fixed;
    left: 20px;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    z-index: 40;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .fab-post:hover { background: var(--accent-strong); }
  .fab-post:active { transform: scale(0.96); }
  .fab-post:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  /* 以前はFAB(左下の「+」)に最後の求人が隠れないよう .job-list 自体に
     大きめの下余白を付けていたが、求人リストがページ中ほどにも置かれる
     ようになり余白が不自然に見えるため撤去。FAB分の逃げは main の
     padding-bottom(80px)で確保している。 */
  .job-list { display: flex; flex-direction: column; gap: 12px; }
  .job-card {
    display: block;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    transition: box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .job-card.is-closed { opacity: 0.75; }
  .job-card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(37, 87, 167, 0.12); }
  .job-card .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--accent-strong); }
  .job-card.has-image { display: flex; gap: 14px; align-items: flex-start; }
  .job-card-body { flex: 1; min-width: 0; }
  .job-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--surface-2); }
  .ad-slot {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 18px 14px;
  }
  .ad-label {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .job-detail-image { width: 100%; max-height: 320px; object-fit: cover; border-radius: var(--radius); margin-bottom: 14px; background: var(--surface-2); }
  .image-preview-wrap { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .image-preview-wrap img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 3px;
    background: var(--surface-2);
    color: var(--text-dim);
  }
  .pill.open { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--teal); }
  .pill.hired { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent-strong); }
  .pill.anon { background: var(--privacy-bg); color: var(--privacy); }
  .pill.settled { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--teal); }
  .pill.unsettled { background: var(--danger-bg); color: var(--danger); }

  .xmr-address {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    word-break: break-all;
    line-height: 1.5;
  }
  .payment-note {
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--privacy-bg);
    border: 1px solid color-mix(in srgb, var(--privacy) 35%, transparent);
    border-radius: var(--radius);
    padding: 10px 12px;
    line-height: 1.6;
  }
  .payment-note strong { color: var(--privacy); }

  /* ---------- 支払い方法のクイック選択(手渡しを一番目立たせ、他は折りたたむ) ---------- */
  .method-quickpick-cash {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--accent);
    color: var(--accent-ink);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .method-quickpick-cash:hover:not(:disabled) { background: var(--accent-strong); }
  .method-quickpick-cash .mq-title { font-size: 15px; font-weight: 700; }
  .method-quickpick-cash .mq-sub { font-size: 12px; font-weight: 500; opacity: 0.85; margin-top: 3px; line-height: 1.5; }
  .method-quickpick-cash.is-inactive {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }
  .method-quickpick-cash.is-inactive .mq-sub { color: var(--text-dim); opacity: 1; }
  .method-other-toggle {
    display: block;
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border);

};
  function tr(ja) { return LANG === "en" ? (STRINGS_EN[ja] || ja) : ja; }

  /* ---------------------------------------------------------------- */
  /* 擬似データ                                                        */
  /* ---------------------------------------------------------------- */

  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fakeAddress(seed) {
    const rnd = mulberry32(seed);
    let h = "";
    for (let i = 0; i < 40; i++) h += Math.floor(rnd() * 16).toString(16);
    return "0x" + h;
  }

  // アカウントのID(文字列)から、見た目用の"アドレス"を毎回同じ値になるように
  // 作る(実際のウォレットアドレスではなく、アバターの色や表示のための見本の値。
  // 本物のアドレスはこのIDに紐づけて保存していない)。
  function hashSeed(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    return h >>> 0;
  }

  /* ---------------------------------------------------------------- */
  /* 本物の共有データベース(Firebase)への接続                          */
  /* このアプリの求人・アカウント・メッセージは、誰がアクセスしても同じ  */
  /* データが見えるよう、この下で作るFirebaseプロジェクト(Firestore)に  */
  /* 保存される。ここに置くのは名前・求人内容・メッセージなどのデータ   */
  /* のみ。Monero・手渡しのやり取りは当事者同士が直接行い、カード決済は  */
  /* Stripe(Connect)側で処理される。ここで使う設定値(apiKeyなど)は      */
  /* 公開しても安全なもので、データの読み書きの制限はFirestore          */
  /* セキュリティルール(firestore.rules)側で行っている。                */
  /* ---------------------------------------------------------------- */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyD_CuoOGrmN6eMoIYK_J7yy3_x5mQEQAhQ",
    authDomain: "jobchain-3eee9.firebaseapp.com",
    projectId: "jobchain-3eee9",
    storageBucket: "jobchain-3eee9.firebasestorage.app",
    messagingSenderId: "861875519405",
    appId: "1:861875519405:web:1b37f6bda27f7a5c856b24",
  };
  const FIREBASE_SDK_VERSION = "12.19.0";

  /* ---------------------------------------------------------------- */
  /* Stripe Connect(Airbnb と同じ Express + destination charge 方式)  */
  /*                                                                   */
  /* STRIPE_CONNECT_ENABLED を false にしている間は、カード決済が選択   */
  /* 肢から外れる(払う手段が無い求人を作らせないため)。Cloud Functions */
  /* をデプロイし、Connectを有効にして、下の公開可能キーを入れてから    */
  /* true にすること。(公開可能キー pk_ は名前のとおり公開して安全)    */
  /* ---------------------------------------------------------------- */
  const STRIPE_CONNECT_ENABLED = false;
  const STRIPE_PUBLISHABLE_KEY = ""; // 例: "pk_live_xxx" / "pk_test_xxx"
  const FUNCTIONS_REGION = "asia-northeast1";

  let fsMod = null;   // firebase/firestore モジュール名前空間(動的importで読み込む)
  let authMod = null; // firebase/auth モジュール名前空間
  let fnMod = null;   // firebase/functions モジュール名前空間
  let fbApp = null;
  let auth = null;
  let db = null;
  let functionsInstance = null;
  let MY_AUTH_UID = null;
  // 匿名アカウントにメールアドレスを紐づけたかどうか。
  // 紐づいていれば、ブラウザのデータを消しても別の端末からでも同じ
  // アカウントに戻れる(= お金を受け取る導線を使う前提条件)。
  let MY_AUTH_EMAIL = null;

  // classic <script>(type="module"ではない)の中からでも、dynamic import()なら
  // ES Modulesとして配布されているFirebase JS SDKを問題なく読み込める。
  // CDN(gstatic)の読み込みに失敗した場合でもこのIIFE全体が止まってしまわない
  // よう、ここでは例外を投げずnullのままにしておき、実際に使う起動処理(init)
  // 側でわかりやすいエラー表示に変える。
  async function initFirebase() {
    if (db) return; // 二重初期化防止
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/`;
    const [{ initializeApp }, authM, fsM, fnM] = await Promise.all([
      import(/* webpackIgnore: true */ base + "firebase-app.js"),
      import(/* webpackIgnore: true */ base + "firebase-auth.js"),
      import(/* webpackIgnore: true */ base + "firebase-firestore.js"),
      // Cloud Functions(決済処理)。Connectを使わない間は読み込むだけで無害。
      import(/* webpackIgnore: true */ base + "firebase-functions.js").catch(() => null),
    ]);
    authMod = authM;
    fsMod = fsM;
    fnMod = fnM;
    fbApp = initializeApp(FIREBASE_CONFIG);
    auth = authMod.getAuth(fbApp);
    db = fsMod.getFirestore(fbApp);
    if (fnMod) functionsInstance = fnMod.getFunctions(fbApp, FUNCTIONS_REGION);
  }

  /** Cloud Functions の呼び出し。エラーメッセージはサーバー側の文言をそのまま使う。 */
  async function callFn(name, data) {
    if (!fnMod || !functionsInstance) throw new Error(tr("決済機能を読み込めませんでした。"));
    const fn = fnMod.httpsCallable(functionsInstance, name);
    const res = await fn(data || {});
    return res.data;
  }

  // ---------------------------------------------------------------- Stripe.js の読み込み
  // 決済フォーム(Payment Element)と、受け取り設定の埋め込み(Connect.js)で使う。
  // 必要になった時点で初めて読み込む(使わない人に余計な通信をさせない)。
  let stripeJsPromise = null;
  function loadStripeJs() {
    if (stripeJsPromise) return stripeJsPromise;
    stripeJsPromise = new Promise((resolve, reject) => {
      if (window.Stripe) { resolve(window.Stripe(STRIPE_PUBLISHABLE_KEY)); return; }
      const s = document.createElement("script");
      s.src = "https://js.stripe.com/v3/";
      s.onload = () => resolve(window.Stripe(STRIPE_PUBLISHABLE_KEY));
      s.onerror = () => reject(new Error(tr("決済機能を読み込めませんでした。")));
      document.head.appendChild(s);
    });
    return stripeJsPromise;
  }

  let connectJsPromise = null;
  function loadConnectJs() {
    if (connectJsPromise) return connectJsPromise;
    connectJsPromise = new Promise((resolve, reject) => {
      if (window.StripeConnect) { resolve(window.StripeConnect); return; }
      const s = document.createElement("script");
      s.src = "https://connect-js.stripe.com/v1.0/connect.js";
      s.async = true;
      s.onload = () => resolve(window.StripeConnect);
      s.onerror = () => reject(new Error(tr("受け取り設定の画面を読み込めませんでした。")));
      document.head.appendChild(s);
    });
    return connectJsPromise;
  }

  // Connectの埋め込みコンポーネントは、アプリ内WebViewでは動作しない
  // (Stripeのドキュメントに明記)。Web版では基本的に埋め込みが使えるが、
  // 将来WebViewから開かれた場合に備えて判定だけ用意しておく。
  function isInAppWebView() {
    try {
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return true;
    } catch (e) { /* noop */ }
    return false;
  }

  // Firestoreの 'in' 演算子は一度に渡せる値の数に上限があるため、
  // 多数のID(サブアカウントが多い場合など)をまとめてクエリするときは
  // 安全のため小分けにする。
  function chunkArray(arr, size) {
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  // 500件というFirestoreの書き込みバッチ上限を超えないよう、
  // 大量のドキュメント削除も安全のため小分けにする。
  async function batchDeleteRefs(refs) {
    const { writeBatch } = fsMod;
    const CHUNK = 400;
    for (const part of chunkArray(refs, CHUNK)) {
      if (!part.length) continue;
      const batch = writeBatch(db);
      part.forEach((ref) => batch.delete(ref));
      await batch.commit();
    }
  }

  // ここから下(ACCOUNTS/JOBS/MESSAGES)は、起動時にFirestoreから読み込んだ
  // データをキャッシュしておく配列・オブジェクト。既存の画面描画コードは
  // このキャッシュを同期的に読むだけで済むようにし、Firestoreとのやり取り
  // (非同期)は読み込み時とデータ変更時の関数だけに閉じ込めている。
  const ACCOUNTS = [];

  function fakeMoneroAddress(seed) {
    const chars = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
    const rnd = mulberry32(seed);
    let s = "4"; // Moneroのメインアドレスは "4" から始まる
    for (let i = 0; i < 94; i++) s += chars[Math.floor(rnd() * chars.length)];
    return s;
  }

  const JOBS = [];

  let currentAccountId = null;

  /* ユーティリティ                                                    */

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // 日本語(マルチバイト文字)を含む文字列でも安全にBase64化する。
  function toBase64Utf8(str) {
    try {
      return btoa(String.fromCharCode(...new TextEncoder().encode(str)));
    } catch {
      return "";
    }
  }

  // 求人に添付する画像は、そのままだと容量が大きすぎてブラウザの保存領域を
  // 圧迫するため、長辺が900pxを超える場合は縮小し、JPEGとして圧縮してから
  // data URL(文字列)として保存する。
  function resizeImageForStorage(file, maxDim = 900, quality = 0.72) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error(tr("画像の読み込みに失敗しました。")));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error(tr("画像の読み込みに失敗しました。対応していない形式の可能性があります。")));
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // 求人ごとの報酬を「高収入・普通・低収入」に分類する。
  // 決済方法(Monero/カード/現金)ごとに単位が違うため、同じ決済方法どうしの中で
  // 報酬が高い順に並べ、上位1割を高収入、下位2割を低収入、残りの真ん中7割を普通とする。
  // 比較できる母数が少ない決済方法(3件未満)は「普通」扱いにする。
  function computeRewardTiers() {
    const groups = {};
    JOBS.forEach((j) => { (groups[j.payMethod] || (groups[j.payMethod] = [])).push(j); });
    const tierById = {};
    Object.values(groups).forEach((list) => {
      const n = list.length;
      if (n < 3) {
        list.forEach((j) => { tierById[j.id] = "normal"; });
        return;
      }
      const sorted = [...list].sort((a, b) => a.reward - b.reward); // 昇順(安い順)
      const lowCount = Math.max(1, Math.round(n * 0.2));
      const highCount = Math.max(1, Math.round(n * 0.1));
      sorted.forEach((j, i) => {
        if (i < lowCount) tierById[j.id] = "low";
        else if (i >= n - highCount) tierById[j.id] = "high";
        else tierById[j.id] = "normal";
      });
    });
    return tierById;
  }

  // このブラウザ(セッション)が持っている、削除されていない自分のアカウントの
  // 中でいちばん最初に作られたものを「ゲスト」枠として扱う(ログアウトや
  // アカウント削除の戻り先)。DB上の特別なフラグではなく表示用の目印。
  function refreshGuestFlag() {
    ACCOUNTS.forEach((a) => { a.isGuest = false; });
    const mine = ACCOUNTS.filter((a) => a.mine && !a.isDeleted)
      .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

  // アカウントの削除。自分が投稿した求人はすべて削除し(応募・チャットもDB側で
  // 連動して削除される)、他人の求人への応募のうち採用されていないものは
  // 取り下げる。アカウント自体は完全には消さず、表示名などだけを
  // 「削除済みアカウント」に置き換える(ソフトデリート) — 完全に消すと、
  // 他人が投稿した求人の「採用者」欄などからこのアカウントが参照できなくなり
  // エラーになるため。自分のアカウントが0個になった場合は、新しい
  // 「匿名ゲスト」を自動的に作り直す(最低1つのアカウントが無いと使えないため)。
  async function deleteAccount(id) {
    const acct = getAccount(id);
    if (!acct) throw new Error(tr("アカウントが見つかりません。"));
    if (!acct.mine) throw new Error(tr("自分のアカウントだけ削除できます。"));

    const { collection, doc, updateDoc, getDocs, query, where } = fsMod;

    // 自分が投稿した求人をすべて削除する。Firestoreには外部キーの
    // カスケード削除が無いため、紐づく応募・チャットも自分の手で
    // 一緒に削除する(Supabase版ではDB側のON DELETE CASCADEに
    // 任せていた部分)。
    const myJobIds = JOBS.filter((j) => j.employerId === id).map((j) => j.id);
    if (myJobIds.length) {
      try {
        await batchDeleteRefs(myJobIds.map((jid) => doc(db, "jobs", jid)));
        for (const chunk of chunkArray(myJobIds, 30)) {
          const appSnap = await getDocs(query(collection(db, "applications"), where("job_id", "in", chunk)));
          await batchDeleteRefs(appSnap.docs.map((d) => d.ref));
          const msgSnap = await getDocs(query(collection(db, "messages"), where("job_id", "in", chunk)));
          await batchDeleteRefs(msgSnap.docs.map((d) => d.ref));
        }
      } catch (e) {
        throw new Error(tr("投稿した求人の削除に失敗しました。"));
      }
    }

    // 採用済みのものは相手側の「採用者」表示のために残し、それ以外の応募だけ取り下げる。
    const hiredJobIds = new Set(JOBS.filter((j) => j.hiredId === id).map((j) => j.id));
    try {
      const appSnap = await getDocs(query(collection(db, "applications"), where("applicant_id", "==", id)));
      const toDrop = appSnap.docs.filter((d) => !hiredJobIds.has(d.data().job_id));
      await batchDeleteRefs(toDrop.map((d) => d.ref));
    } catch (e) {
      throw new Error(tr("応募の取り下げに失敗しました。"));
    }

    try {
      await updateDoc(doc(db, "accounts", id), {
        is_deleted: true, name: tr("削除済みアカウント"), bio: "", skills: "", role: "", monero_address: "",
      });
    } catch (e) {
      throw new Error(tr("アカウントの削除に失敗しました。"));
    }

    for (let i = JOBS.length - 1; i >= 0; i--) {
      if (JOBS[i].employerId === id) JOBS.splice(i, 1);
    }
    JOBS.forEach((j) => {
      j.applicants = j.applicants.filter((a) => a.accountId !== id || j.hiredId === id);
    });
    acct.isDeleted = true;
    acct.name = tr("削除済みアカウント");
    acct.bio = "";
    acct.skills = "";
    acct.role = "";
    acct.moneroAddress = "";

    if (currentAccountId === id) {
      const remaining = ACCOUNTS.filter((a) => a.mine && !a.isDeleted);
      if (remaining.length) {
        currentAccountId = remaining[0].id;
      } else {
        const created = await createDefaultGuestAccount();
        currentAccountId = created.id;
      }
    }
    refreshGuestFlag();
    persistCurrentAccountId();
  }

  async function applyToJob(jobId) {
    const job = getJob(jobId);
    const acct = me();
    if (acct.id === job.employerId) throw new Error(tr("自分が投稿した求人には応募できません。"));
    if (!job.isOpen) throw new Error(tr("この求人の募集は終了しています。"));
    if (job.applicants.some((a) => a.accountId === acct.id)) throw new Error(tr("すでに応募済みです。"));
    // 応募は常に無料。支払いが発生するのは採用が決まったときの報酬のみ。
    const { collection, addDoc } = fsMod;
    const appliedAt = new Date().toISOString();
    try {
      await addDoc(collection(db, "applications"), { job_id: job.id, applicant_id: acct.id, applied_at: appliedAt });
    } catch (e) {
      throw new Error(tr("応募に失敗しました。"));
    }
    job.applicants.push({ accountId: acct.id, appliedAt });
  }

  async function hireApplicant(jobId, applicantId) {
    const job = getJob(jobId);
    if (me().id !== job.employerId) throw new Error(tr("採用できるのは求人を投稿した投稿者のみです。"));
    if (!job.isOpen) throw new Error(tr("この求人はすでに締め切られています。"));
    // 採用の確定はセキュリティルールで「求人の投稿者本人だけ」に制限している。
    const { doc, updateDoc } = fsMod;
    try {
      await updateDoc(doc(db, "jobs", job.id), { is_open: false, hired_id: applicantId });
    } catch (e) {
      throw new Error(tr("採用処理に失敗しました。"));
    }
    job.isOpen = false;
    job.hiredId = applicantId;
    // Monero・カード・手渡しは支払いがアプリ外で行われるため、
    // 実際に支払いが完了したら「支払い済みにする」で自己申告する。
  }

  async function markSettled(jobId) {
    const job = getJob(jobId);
    if (me().id !== job.employerId) throw new Error(tr("支払い状況を変更できるのは求人を投稿した投稿者のみです。"));
    if (!job.hiredId) throw new Error(tr("採用者が確定していません。"));
    const { doc, updateDoc } = fsMod;
    try {
      await updateDoc(doc(db, "jobs", job.id), { settled: true });
    } catch (e) {
      throw new Error(tr("更新に失敗しました。"));
    }
    job.settled = true;
  }

  // 求人ごとの「評価(レビュー)」。支払い済みになった求人についてのみ、
  // その求人の投稿者⇔採用者の当事者同士が、お互いを1〜5の星で評価できる。
  // 匿名のままでも、過去の取引実績(星評価)が見えるようにすることで、
  // 使い捨てアカウントによる詐欺的な行為を多少なりとも抑止する狙い。
  function hasReviewed(jobId, fromId) {
    return REVIEWS.some((r) => r.job_id === jobId && r.from_id === fromId);
  }

  // 指定したアカウントが「評価された側」になっているレビューをもとに、
  // 平均評価と件数を計算する。レビューが1件も無ければnullを返す。
  function accountRatingStats(accountId) {
    const list = REVIEWS.filter((r) => r.to_id === accountId);
    if (!list.length) return null;
    const avg = list.reduce((sum, r) => sum + r.rating, 0) / list.length;
    return { avg, count: list.length };
  }

  function ratingBadgeHtml(accountId) {
    const stats = accountRatingStats(accountId);
    if (!stats) return "";
    return `<span class="rating-badge">★${stats.avg.toFixed(1)} (${stats.count})</span>`;
  }

  async function submitReview(jobId, toId, rating, comment) {
    const job = getJob(jobId);
    const acct = me();
    if (!job.settled) throw new Error(tr("支払い済みになった求人についてのみ評価できます。"));
    const participantIds = [job.employerId, job.hiredId];
    if (!job.hiredId || !participantIds.includes(acct.id) || !participantIds.includes(toId) || acct.id === toId) {
      throw new Error(tr("この求人の当事者同士でのみ評価できます。"));
    }
    if (!Number.isInteger(rating) || rating < 1 || rating > 5) {
      throw new Error(tr("評価は星1〜5個の範囲で指定してください。"));
    }
    if (hasReviewed(jobId, acct.id)) throw new Error(tr("この求人についてはすでに評価済みです。"));
    const { doc, setDoc } = fsMod;
    const reviewId = `${jobId}_${acct.id}`;
    const payload = {
      job_id: jobId,
      from_id: acct.id,
      to_id: toId,
      rating,
      comment: (comment || "").slice(0, 500),
      created_at: new Date().toISOString(),
    };
    try {
      await setDoc(doc(db, "reviews", reviewId), payload);
    } catch (e) {
      throw new Error(tr("評価の送信に失敗しました。"));
    }
    REVIEWS.push({ id: reviewId, ...payload });
  }

  // 求人詳細ページの下部に表示する、評価フォーム/評価結果の描画。
  // 投稿者・採用者どちらのビューからも共通で呼べるよう独立した関数にしている。
  function renderReviewSection(job) {
    const container = document.getElementById("review-section");
    if (!container) return;
    const acct = me();
    const participantIds = [job.employerId, job.hiredId].filter(Boolean);
    if (!job.hiredId || !participantIds.includes(acct.id)) {
      container.innerHTML = "";
      return;
    }
    const otherId = acct.id === job.employerId ? job.hiredId : job.employerId;
    const other = getAccount(otherId);
    const otherStats = accountRatingStats(otherId);
    const myExistingReview = REVIEWS.find((r) => r.job_id === job.id && r.from_id === acct.id);

    let html = `<div class="card" style="margin-top:18px;">`;
    html += `<div class="section-title">${LANG === "en" ? `Review ${escapeHtml(other.name)}` : `${escapeHtml(other.name)}を評価する`}</div>`;
    html += `<div style="font-size:13px; color:var(--text-dim); margin-bottom:12px;">${LANG === "en" ? "Overall rating: " : "総合評価: "}${otherStats ? `★${otherStats.avg.toFixed(1)} (${otherStats.count})` : tr("まだ評価がありません")}</div>`;

    if (!job.settled) {
      html += `<p style="font-size:13px; color:var(--text-dim);">${tr("支払い済みにすると、お互いを評価できるようになります。")}</p>`;
    } else if (myExistingReview) {
      html += `
        <div style="font-size:14px;">
          ${tr("あなたの評価")}: ${"★".repeat(myExistingReview.rating)}${"☆".repeat(5 - myExistingReview.rating)}
          ${myExistingReview.comment ? `<div style="margin-top:6px; font-size:13px; color:var(--text-dim); white-space:pre-wrap;">${escapeHtml(myExistingReview.comment)}</div>` : ""}
        </div>
      `;
    } else {
      html += `
        <select id="review-rating" style="margin-bottom:8px;">
          ${[5, 4, 3, 2, 1].map((n) => `<option value="${n}">${"★".repeat(n)}${"☆".repeat(5 - n)}</option>`).join("")}
        </select>
        <textarea id="review-comment" rows="2" maxlength="500" placeholder="${tr("コメント(任意)")}" style="width:100%; display:block; margin-bottom:8px;"></textarea>
        <button type="button" class="btn-accent btn-small" id="review-submit-btn">${tr("評価を送信する")}</button>
      `;
    }
    html += `</div>`;
    container.innerHTML = html;

    const submitBtn = document.getElementById("review-submit-btn");
    if (submitBtn) {
      submitBtn.addEventListener("click", async () => {
        submitBtn.disabled = true;
        const rating = Number(document.getElementById("review-rating").value);
        const comment = document.getElementById("review-comment").value.trim();
        try {
          await submitReview(job.id, otherId, rating, comment);
          toast(tr("評価を送信しました。"), "success");
          renderReviewSection(job);
        } catch (err) {
          toast((err && err.message) || tr("評価の送信に失敗しました。"), "error");
          submitBtn.disabled = false;
        }
      });
    }
  }

  async function closeJob(jobId) {
    const job = getJob(jobId);
    const acct = me();
    if (acct.id !== job.employerId) throw new Error(tr("締め切れるのは求人を投稿した投稿者のみです。"));
    if (!job.isOpen) throw new Error(tr("すでに締め切られています。"));
    const { doc, updateDoc } = fsMod;
    try {
      await updateDoc(doc(db, "jobs", job.id), { is_open: false });
    } catch (e) {
      throw new Error(tr("更新に失敗しました。"));
    }
    job.isOpen = false;
  }

  async function sendMessage(jobId, toId, text) {
    const { collection, addDoc } = fsMod;
    const at = new Date().toISOString();
    try {
      await addDoc(collection(db, "messages"), { job_id: jobId, from_id: currentAccountId, to_id: toId, text, created_at: at });
    } catch (e) {
      throw new Error(tr("送信に失敗しました。"));
    }
    const key = roomKey(jobId, currentAccountId, toId);
    if (!MESSAGES[key]) MESSAGES[key] = [];
    MESSAGES[key].push({ fromId: currentAccountId, text, at });
  }

  /* ---------------------------------------------------------------- */
  /* Firestoreからの読み込み(全員で共有される本物のデータベース)。       */
  /* どのアカウントを選んでいるかの記憶と、オンチェーン送金の記録だけは  */
  /* このブラウザだけのローカルな情報として別に保存する。                */
  /* ---------------------------------------------------------------- */

  const CURRENT_ACCOUNT_KEY = "jobchain-current-account-v1";
  function persistCurrentAccountId() {
    try { localStorage.setItem(CURRENT_ACCOUNT_KEY, currentAccountId); } catch {}
  }

  // メールアドレスも秘密鍵も不要な「匿名認証」でサインインする。これにより、
  // このブラウザのセッションごとに本物の(なりすましのできない)IDが発行され、
  // セキュリティルールが「自分の作ったアカウント・求人だけ書き換えられる」
  // を判定できるようになる。
  async function ensureAuth() {
    await initFirebase();
    const user = await new Promise((resolve, reject) => {
      const unsubscribe = authMod.onAuthStateChanged(
        auth,
        (u) => {
          unsubscribe();
          if (u) { resolve(u); return; }
          authMod.signInAnonymously(auth)
            .then((cred) => resolve(cred.user))
            .catch(reject);
        },
        (err) => { unsubscribe(); reject(err); }
      );
    });
    MY_AUTH_UID = user.uid;
    MY_AUTH_EMAIL = user.email || null;
  }

  // ---------------------------------------------------------------- メール認証
  // このアプリは匿名認証で始まるが、匿名のままだとブラウザのデータを消したり
  // 機種変したりした時点で、そのアカウントに二度と戻れない。普段の投稿・応募は
  // それでも構わないが、カード決済で報酬をやり取りする場合は「入金待ちのお金に
  // アクセスできなくなる」事故になるため、メールアドレスの登録を必須にしている。
  //
  // 重要: linkWithCredential は匿名アカウントのUIDをそのまま引き継ぐので、
  // 既存のアカウント・求人・チャットは一切失われない。

  function hasEmailAuth() { return !!MY_AUTH_EMAIL; }

  function friendlyAuthError(err) {
    const code = (err && err.code) || "";
    if (code === "auth/email-already-in-use" || code === "auth/credential-already-in-use") {
      return tr("このメールアドレスは既に使われています。「別の端末から引き継ぐ」からログインしてください。");
    }
    if (code === "auth/weak-password") return tr("パスワードは6文字以上にしてください。");
    if (code === "auth/invalid-email") return tr("メールアドレスの形式が正しくありません。");
    if (code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/user-not-found") {
      return tr("メールアドレスかパスワードが違います。");
    }
    if (code === "auth/too-many-requests") return tr("試行回数が多すぎます。しばらく待ってからお試しください。");
    return (err && err.message) || tr("処理に失敗しました。");
  }

  // 今の匿名アカウントにメールアドレスを紐づける(UIDは変わらない)
  async function linkEmail(email, password) {
    const cred = authMod.EmailAuthProvider.credential(email, password);
    const result = await authMod.linkWithCredential(auth.currentUser, cred);
    MY_AUTH_EMAIL = result.user.email || email;
  }

  // 別の端末などから、登録済みのアカウントに入り直す。
  async function signInWithEmail(email, password) {
    await authMod.signInWithEmailAndPassword(auth, email, password);
  }

  async function sendPasswordReset(email) {
    await authMod.sendPasswordResetEmail(auth, email);
  }

  // 起動時に、アカウント・求人・応募・メッセージをすべてFirestoreから読み込み、
  // 既存の描画コードが読むACCOUNTS/JOBS/MESSAGESのキャッシュに反映する。
  async function fetchAllData() {
    const { collection, getDocs, query, orderBy, where } = fsMod;

    const [accSnap, jobSnap, appSnap, reviewSnap] = await Promise.all([
      getDocs(query(collection(db, "accounts"), orderBy("created_at", "asc"))),
      getDocs(query(collection(db, "jobs"), orderBy("created_at", "desc"))),
      getDocs(collection(db, "applications")),
      getDocs(collection(db, "reviews")),
    ]);

    // レビューは(メッセージと違って)誰が読んでも良い情報(お互いの信頼度の
    // 目安として公開する評価)なので、求人・アカウントと同じく絞り込み無しで
    // 全件取得する。
    REVIEWS.length = 0;
    REVIEWS.push(...reviewSnap.docs.map((d) => ({ id: d.id, ...d.data() })));

    ACCOUNTS.length = 0;
    ACCOUNTS.push(...accSnap.docs.map((d) => mapAccountRow({ id: d.id, ...d.data() })));

    JOBS.length = 0;
    JOBS.push(...jobSnap.docs.map((d) => mapJobRow({ id: d.id, ...d.data() })));
    const jobsById = new Map(JOBS.map((j) => [j.id, j]));
    appSnap.docs.forEach((d) => {
      const row = d.data();
      const job = jobsById.get(row.job_id);
      if (job) job.applicants.push(mapApplicationRow(row));
    });

    // メッセージは「自分が関わっているもの」だけを読み込む(プライバシーのため
    // Firestoreのセキュリティルールでもそう制限している)。ルール上、
    // クエリ自体が絞り込まれている必要があるため、自分の(サブアカウント
    // 含む)口座ID宛て/発の2種類のクエリに分けて取得し、あとで合流させる。
    const myIds = ACCOUNTS.filter((a) => a.mine).map((a) => a.id);
    const msgRows = [];
    const seenMsgIds = new Set();
    for (const chunk of chunkArray(myIds, 30)) {
      const [fromSnap, toSnap] = await Promise.all([
        getDocs(query(collection(db, "messages"), where("from_id", "in", chunk))),
        getDocs(query(collection(db, "messages"), where("to_id", "in", chunk))),
      ]);
      [...fromSnap.docs, ...toSnap.docs].forEach((d) => {
        if (seenMsgIds.has(d.id)) return;
        seenMsgIds.add(d.id);
        msgRows.push(d.data());
      });
    }
    msgRows.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    Object.keys(MESSAGES).forEach((k) => delete MESSAGES[k]);
    msgRows.forEach((row) => {
      const key = roomKey(row.job_id, row.from_id, row.to_id);
      if (!MESSAGES[key]) MESSAGES[key] = [];
      MESSAGES[key].push({ fromId: row.from_id, text: row.text, at: row.created_at });
    });

    // 自分のアカウントが1つも無ければ(初回訪問、または以前すべて削除した場合)、
    // 既定の「匿名ゲスト」アカウントを自動的に作る。
    let mine = ACCOUNTS.filter((a) => a.mine && !a.isDeleted);
    if (!mine.length) {
      const created = await createDefaultGuestAccount();
      mine = [created];
    }
    refreshGuestFlag();

    let savedId = null;
    try { savedId = localStorage.getItem(CURRENT_ACCOUNT_KEY); } catch {}
    const savedAccount = savedId && mine.find((a) => a.id === savedId);
    currentAccountId = savedAccount ? savedAccount.id : mine[0].id;
    persistCurrentAccountId();
  }


  /* ---------------------------------------------------------------- */
  /* ルーター & 描画                                                    */
  /* ---------------------------------------------------------------- */

  function currentRoute() {
    const raw = (location.hash || "#list").slice(1);
    const [hash, queryStr] = raw.split("?");
    if (hash.startsWith("job-")) return { name: "job", id: hash.slice(4), query: new URLSearchParams(queryStr || "") };
    if (["search", "list", "post", "dashboard", "profile"].includes(hash)) {
      return { name: hash, query: new URLSearchParams(queryStr || "") };
    }
    return { name: "list", query: new URLSearchParams() };
  }

  function renderShell() {
    const route = currentRoute();
    document.querySelectorAll("#nav-tabs a").forEach((a) => {
      a.classList.toggle("active", a.dataset.tab === route.name || (route.name === "job" && a.dataset.tab === "list"));
    });
    document.getElementById("fab-post").hidden = route.name === "post";
    const acct = me();
    const btn = document.getElementById("account-btn");
    btn.classList.toggle("is-guest", !!acct.isGuest);
    if (acct.isGuest) {
      btn.innerHTML = `<span class="login-label">${tr("ログイン")}</span>`;
    } else {
      btn.innerHTML = `
        <svg class="avatar" id="account-avatar" viewBox="0 0 24 24">${avatarSvg(acct.address)}</svg>
        <span class="who">
          <span class="name" id="account-name">${escapeHtml(acct.name)}</span>
        </span>
      `;
    }
  }

  function renderAccountPanel() {
    const panel = document.getElementById("account-panel");
    const guest = ACCOUNTS.find((a) => a.isGuest);
    const samples = ACCOUNTS.filter((a) => a.mine && !a.isGuest && !a.isDeleted);

    function rowHtml(a) {
      return `
        <button class="account-row ${a.id === currentAccountId ? "current" : ""}" data-switch="${a.id}">
          <svg class="avatar" viewBox="0 0 24 24">${avatarSvg(a.address)}</svg>
          <span class="who">
            <div class="name">${escapeHtml(a.name)} ${a.role === "employer" ? tr("(投稿者)") : a.role === "applicant" ? tr("(応募者)") : ""}</div>
            <div class="addr mono">${shortAddr(a.address)}</div>
          </span>
        </button>
      `;
    }

    const loggedIn = !me().isGuest;
    panel.innerHTML = `
      <div class="hint-line">${tr("ログイン不要 — 匿名ゲストのまま投稿・応募できます。ここではウォレット接続の代わりにアカウントを選べます。")}</div>
      ${rowHtml(guest)}
      ${samples.length ? `
        <div class="hint-line" style="border:none; border-top:1px solid var(--border); margin:6px 0 0; padding:10px 8px 6px;">${tr("ほかのアカウントに切り替える(任意)")}</div>
        ${samples.map(rowHtml).join("")}
      ` : ""}
      ${loggedIn ? `
        <button class="btn-ghost btn-small" id="account-logout" style="width:100%; margin-top:10px;" type="button">${tr("ログアウト(匿名ゲストに戻る)")}</button>
      ` : ""}
      <div style="border-top:1px solid var(--border); margin-top:10px; padding-top:10px;">
        <button class="btn-ghost btn-small" id="signup-toggle" style="width:100%;" type="button">${tr("＋ 新規登録(新しいアカウントを作る)")}</button>
      </div>
      <div style="border-top:1px solid var(--border); margin-top:10px; padding-top:10px;">
        ${hasEmailAuth() ? `
          <div style="font-size:11.5px; color:var(--text-dim); padding:0 8px 8px;">
            ${tr("引き継ぎ用メール")}: <span class="mono">${escapeHtml(MY_AUTH_EMAIL)}</span>
          </div>
          <div style="font-size:11px; color:var(--text-dim); padding:0 8px;">${tr("この端末のデータを消しても、同じメールアドレスでログインすれば戻れます。")}</div>
        ` : `
          <div style="font-size:11.5px; color:var(--text-dim); padding:0 8px 8px;">${tr("今はこの端末でしか使えません。データを消すとアカウントに戻れなくなります。")}</div>
          <button class="btn-ghost btn-small" id="email-link-btn" style="width:100%;" type="button">${tr("メールアドレスを登録(引き継ぎ用)")}</button>
          <button class="btn-ghost btn-small" id="email-signin-btn" style="width:100%; margin-top:6px;" type="button">${tr("別の端末から引き継ぐ")}</button>
        `}
      </div>
    `;
    panel.querySelectorAll("[data-switch]").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentAccountId = btn.dataset.switch;
        persistCurrentAccountId();
        panel.hidden = true;
        route();
      });
    });
    const logoutBtn = document.getElementById("account-logout");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        currentAccountId = guest.id;
        persistCurrentAccountId();
        panel.hidden = true;
        toast(tr("ログアウトしました。"), "success");
        route();
      });
    }
    document.getElementById("signup-toggle").addEventListener("click", () => {
      panel.hidden = true;
      openSignupModal();
    });
    const emailLinkBtn = document.getElementById("email-link-btn");
    if (emailLinkBtn) {
      emailLinkBtn.addEventListener("click", () => { panel.hidden = true; openEmailModal("link"); });
    }
    const emailSignInBtn = document.getElementById("email-signin-btn");
    if (emailSignInBtn) {
      emailSignInBtn.addEventListener("click", () => { panel.hidden = true; openEmailModal("signin"); });
    }
  }

  // 新規登録は、狭いアカウントパネルの中に小さく出すのではなく、
  // 画面中央に大きく表示するモーダルで行う。
  function openSignupModal() {
    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-overlay" id="signup-modal-overlay">
        <div class="modal-box modal-box-lg">
          <h2 style="font-size:20px; margin-bottom:14px;">${tr("新規登録")}</h2>
          <p style="font-size:13.5px; color:var(--text-dim); line-height:1.7; margin-bottom:20px;">${tr("秘密鍵もメールアドレスも不要です。表示名(任意)を入れるだけでその場に新しいアカウントが作られ、自動的にログインします。求人を投稿することも、応募することも、どちらも同じアカウントでできます。")}</p>
          <form id="signup-form" class="stack">
            <div class="field" style="margin-bottom:0;">
              <label for="signup-name">${tr("表示名(任意)")}</label>
              <input id="signup-name" placeholder="${tr("空欄なら「新規ユーザー」")}" />
            </div>
            <div class="modal-actions" style="margin-top:6px;">
              <button type="button" class="btn-ghost" id="signup-cancel">${tr("キャンセル")}</button>
              <button type="submit" class="btn-accent">${tr("登録してログイン")}</button>
            </div>
          </form>
        </div>
      </div>
    `;
    const close = () => { root.innerHTML = ""; };
    document.getElementById("signup-modal-overlay").addEventListener("click", (e) => {
      if (e.target.id === "signup-modal-overlay") close();
    });
    document.getElementById("signup-cancel").addEventListener("click", close);
    document.getElementById("signup-name").focus();
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("signup-name").value.trim();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      try {
        const account = await createAccount({ name });
        currentAccountId = account.id;
        persistCurrentAccountId();
        close();
        toast(LANG === "en" ? `Registered and logged in as "${account.name}".` : `「${account.name}」として登録・ログインしました。`, "success");
        route();
      } catch (err) {
        if (submitBtn) submitBtn.disabled = false;
        toast((err && err.message) || tr("登録に失敗しました。"), "error");
      }
    });
  }

  // メールアドレスの登録(link)と、別端末からの引き継ぎ(signin)の共通モーダル。
  // onDone を渡すと、成功後にそのまま元の操作(受け取り設定など)へ進める。
  function openEmailModal(mode, onDone) {
    const root = document.getElementById("modal-root");
    const isLink = mode !== "signin";
    root.innerHTML = `
      <div class="modal-overlay" id="email-modal-overlay">
        <div class="modal-box modal-box-lg">
          <h2 style="font-size:20px; margin-bottom:14px;">${isLink ? tr("メールアドレスを登録") : tr("別の端末から引き継ぐ")}</h2>
          <p style="font-size:13.5px; color:var(--text-dim); line-height:1.7; margin-bottom:18px;">${isLink
            ? tr("カード決済を使うにはメールアドレスの登録が必要です。登録しても、今のアカウント・投稿・チャットはそのまま引き継がれます。手渡しやMoneroだけを使う場合は登録不要です。")
            : tr("以前この端末以外で登録したメールアドレスとパスワードを入力してください。そのアカウントに戻ります。")}</p>
          <form id="email-form" class="stack">
            <div class="field" style="margin-bottom:0;">
              <label for="email-input">${tr("メールアドレス")}</label>
              <input id="email-input" type="email" required autocomplete="email" placeholder="you@example.com" />
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="email-password">${tr("パスワード(6文字以上)")}</label>
              <input id="email-password" type="password" required minlength="6" autocomplete="${isLink ? "new-password" : "current-password"}" />
            </div>
            ${isLink ? "" : `<button type="button" class="btn-ghost btn-small" id="email-reset" style="align-self:flex-start;">${tr("パスワードを忘れた場合")}</button>`}
            <div class="modal-actions" style="margin-top:6px;">
              <button type="button" class="btn-ghost" id="email-cancel">${tr("キャンセル")}</button>
              <button type="submit" class="btn-accent">${isLink ? tr("登録する") : tr("ログイン")}</button>
            </div>
          </form>
        </div>
      </div>
    `;
    const close = () => { root.innerHTML = ""; };
    document.getElementById("email-modal-overlay").addEventListener("click", (e) => {
      if (e.target.id === "email-modal-overlay") close();
    });
    document.getElementById("email-cancel").addEventListener("click", close);
    document.getElementById("email-input").focus();

    const resetBtn = document.getElementById("email-reset");
    if (resetBtn) {
      resetBtn.addEventListener("click", async () => {
        const email = document.getElementById("email-input").value.trim();
        if (!email) { toast(tr("メールアドレスを入力してください。"), "error"); return; }
        try {
          await sendPasswordReset(email);
          toast(tr("パスワード再設定用のメールを送りました。"), "success");
        } catch (err) { toast(friendlyAuthError(err), "error"); }
      });
    }

    document.getElementById("email-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("email-password").value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      try {
        if (isLink) {
          await linkEmail(email, password);
          close();
          toast(tr("メールアドレスを登録しました。"), "success");
          renderShell();
          if (typeof onDone === "function") onDone();
          else route();
        } else {
          await signInWithEmail(email, password);
          // サインインでFirebaseのユーザーが入れ替わるため、取り違えを防ぐ
          // 意味でもページごと読み込み直す。
          close();
          toast(tr("ログインしました。読み込み直します。"), "success");
          setTimeout(() => location.reload(), 600);
        }
      } catch (err) {
        if (submitBtn) submitBtn.disabled = false;
        toast(friendlyAuthError(err), "error");
      }
    });
  }

  /**
   * 報酬の支払いモーダル(Stripe Payment Element)。
   * 外部サイトに遷移せず、この画面の中でカード番号やApple Payの操作が完結する。
   * カード情報はStripeのiframe内で扱われるため、このアプリは一切触れない。
   */
  async function openPaymentModal(job, acct) {
    if (!hasEmailAuth()) { openEmailModal("link"); return; }

    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-overlay" id="pay-modal-overlay">
        <div class="modal-box modal-box-lg">
          <h2 style="font-size:20px; margin-bottom:6px;">${tr("報酬の支払い")}</h2>
          <div style="font-size:14px; margin-bottom:16px;"><span class="mono">${fmtAmount(job.reward, job.payMethod)}</span></div>
          <div id="payment-element"><div class="empty">${tr("読み込み中…")}</div></div>
          <div id="pay-error" style="color:var(--danger); font-size:13px; margin-top:10px;" hidden></div>
          <div class="modal-actions" style="margin-top:16px;">
            <button type="button" class="btn-ghost" id="pay-cancel">${tr("キャンセル")}</button>
            <button type="button" class="btn-accent" id="pay-submit" disabled>${tr("支払う")}</button>
          </div>
        </div>
      </div>
    `;
    const close = () => { root.innerHTML = ""; };
    document.getElementById("pay-cancel").addEventListener("click", close);
    const showError = (msg) => {
      const el = document.getElementById("pay-error");
      if (!el) return;
      el.textContent = msg;
      el.hidden = false;
    };

    let stripe, elements;
    try {
      // 金額はサーバー側(Cloud Functions)がFirestoreの求人から読んで決める。
      // クライアントは金額を一切渡さない。
      const [stripeObj, intent] = await Promise.all([
        loadStripeJs(),
        callFn("createJobPaymentIntent", { jobId: job.id, accountId: acct.id }),
      ]);
      stripe = stripeObj;
      elements = stripe.elements({
        clientSecret: intent.clientSecret,
        appearance: { theme: "stripe" },
      });
      const paymentElement = elements.create("payment");
      const mount = document.getElementById("payment-element");
      if (!mount) return; // モーダルが閉じられた
      mount.innerHTML = "";
      paymentElement.mount(mount);
      const submitBtn = document.getElementById("pay-submit");
      if (submitBtn) submitBtn.disabled = false;
    } catch (err) {
      showError((err && err.message) || tr("支払いを開始できませんでした。"));
      return;
    }

    document.getElementById("pay-submit").addEventListener("click", async () => {
      const submitBtn = document.getElementById("pay-submit");
      submitBtn.disabled = true;
      submitBtn.textContent = tr("処理中…");
      // 3Dセキュア(本人認証)が必要な場合はStripeが自動で画面を出す。
      const { error } = await stripe.confirmPayment({
        elements,
        redirect: "if_required",
        confirmParams: { return_url: location.href },
      });
      if (error) {
        showError(error.message || tr("支払いに失敗しました。"));
        submitBtn.disabled = false;
        submitBtn.textContent = tr("支払う");
        return;
      }
      close();
      toast(tr("支払いが完了しました。"), "success");
      // settled はWebhookが立てる。反映までわずかに時間差があるため少し待つ。
      setTimeout(() => { reloadAndRender(job.id); }, 1500);
    });
  }

  // 支払い後など、サーバー側の変更を取り込んで画面を描き直す

    try {

  /**
   * 受け取り設定(Expressのオンボーディング)を開始する。
   * Web版はページ内に埋め込み、WebViewから開かれた場合は埋め込みが
   * 使えないためStripeホストのページへ遷移する。
   */
  async function startConnectOnboarding(acct) {
    if (!acct.stripeAccountId) {
      const created = await callFn("createConnectAccount", { accountId: acct.id });
      acct.stripeAccountId = created.stripeAccountId;
    }

    if (isInAppWebView()) {
      const { url } = await callFn("createAccountLink", { accountId: acct.id });
      window.location.href = url;
      return;
    }

    const container = document.getElementById("connect-embed");
    if (!container) return;
    container.innerHTML = `<div class="empty">${tr("読み込み中…")}</div>`;

    const StripeConnect = await loadConnectJs();
    const instance = StripeConnect.init({
      publishableKey: STRIPE_PUBLISHABLE_KEY,
      fetchClientSecret: async () => {
        const res = await callFn("createAccountSession", { accountId: acct.id });
        return res.clientSecret;
      },
    });
    const onboarding = instance.create("account-onboarding");
    onboarding.setOnExit(async () => {
      try {
        const res = await callFn("refreshConnectStatus", { accountId: acct.id });
        acct.stripeChargesEnabled = !!(res && res.ready);
        if (res && res.ready) toast(tr("受け取り設定が完了しました。"), "success");
      } catch (e) { /* noop */ }
      viewDashboard();
    });
    container.innerHTML = "";
    container.appendChild(onboarding);
  }

  function viewSearch(query) {
    const root = document.getElementById("view-root");
    const initialQ = (query && query.get("q")) || "";
    const initialLoc = (query && query.get("loc")) || "";
    const initialMethod = (query && query.get("method")) || "";
    const initialDate = (query && query.get("date")) || "";
    const initialRewardTier = (query && query.get("tier")) || "";
    const REMOTE_OPTIONS = [];
    const PREF_OPTIONS = PREFECTURES.map(([value]) => value);
    root.innerHTML = `
      <div class="page-head search-page-head">
        <h1>${tr("求人を検索")}</h1>
      </div>
      <div class="search-hero-wrap">
        <div id="search-wrapper" style="max-width:720px; width:100%; position:relative;">

              <input type="text" id="search-loc" class="loc-input" placeholder="${tr("場所を選択・入力")}" value="${escapeHtml(initialLoc)}" autocomplete="off" />
              <button type="submit" class="toolbar-search-btn" aria-label="${tr("検索")}">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

                <option value="card" ${initialMethod === "card" ? "selected" : ""}>${tr("カード / Apple Pay")}</option>
                <option value="cash" ${initialMethod === "cash" ? "selected" : ""}>${tr("手渡し(現金)")}</option>
              </select>
            </div>
            <div class="field date-field">
              <label id="search-date-label" for="search-date-btn">${tr("勤務日(以降)")}</label>
              <button type="button" id="search-date-btn" class="date-btn">
                <span id="search-date-display" class="${initialDate ? "" : "is-placeholder"}">${initialDate ? escapeHtml(fmtDateDisplay(initialDate)) : tr("指定なし")}</span>
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              </button>
            </div>
            <div class="field">
              <label for="search-tier">${tr("報酬の目安")}</label>
              <select id="search-tier">
                <option value="">${tr("すべて")}</option>
                <option value="high" ${initialRewardTier === "high" ? "selected" : ""}>${tr("高収入")}</option>
                <option value="normal" ${initialRewardTier === "normal" ? "selected" : ""}>${tr("普通")}</option>
                <option value="low" ${initialRewardTier === "low" ? "selected" : ""}>${tr("低収入")}</option>
              </select>
            </div>
          </div>
          <div class="date-calendar" id="date-calendar" hidden></div>
        </div>
      </div>
      <div style="margin-top:14px; text-align:center;">
        <a href="#list" style="font-size:13.5px; color:var(--text-dim);">${tr("キーワードなしですべての求人を見る →")}</a>
      </div>
    `;

    const locInput = document.getElementById("search-loc");
    const dropdown = document.getElementById("loc-dropdown");
    const methodSelect = document.getElementById("search-method");

    /* ---- 独自カレンダー(勤務日) ---- */
    let selectedDate = initialDate || "";
    const today = new Date();
    const todayIso = toIsoDate(today.getFullYear(), today.getMonth(), today.getDate());
    let calCursor = (() => {
      if (selectedDate) {
        const [y, m] = selectedDate.split("-").map(Number);
        return new Date(y, m - 1, 1);
      }
      return new Date(today.getFullYear(), today.getMonth(), 1);
    })();
    const dateBtn = document.getElementById("search-date-btn");
    const dateDisplay = document.getElementById("search-date-display");
    const dateCal = document.getElementById("date-calendar");
    const searchWrapper = document.getElementById("search-wrapper");
    const DOW_LABELS = LANG === "en" ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["日", "月", "火", "水", "木", "金", "土"];

    // 未選択(指定なし)の時は他のプレースホルダーと同じ薄い色、日付を選ぶと通常の文字色にする。
    function updateDateDisplay() {
      if (selectedDate) {
        dateDisplay.textContent = fmtDateDisplay(selectedDate);
        dateDisplay.classList.remove("is-placeholder");
      } else {
        dateDisplay.textContent = tr("指定なし");
        dateDisplay.classList.add("is-placeholder");
      }
    }

    // position:absoluteで検索欄全体の枠(#search-wrapper)を基準に配置する。
    // 横方向はその枠の中に収まるようにし、縦方向はボタンの下にそのまま表示する
    // (画面に収まりきらない場合は、カレンダー自体ではなくページ全体がスクロールして見える)。
    function positionCalendar() {
      const wrapperRect = searchWrapper.getBoundingClientRect();
      const btnRect = dateBtn.getBoundingClientRect();
      const calWidth = Math.min(380, wrapperRect.width);
      dateCal.style.width = calWidth + "px";

      let left = btnRect.left - wrapperRect.left;
      const maxLeft = wrapperRect.width - calWidth;
      if (left > maxLeft) left = Math.max(0, maxLeft);
      if (left < 0) left = 0;
      dateCal.style.left = left + "px";
      dateCal.style.top = (btnRect.bottom - wrapperRect.top + 8) + "px";
    }

    function renderCalendar() {
      const year = calCursor.getFullYear();
      const month = calCursor.getMonth();
      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      let cells = "";
      for (let i = 0; i < firstDow; i++) {
        cells += `<button type="button" class="day other-month" disabled>${daysInPrevMonth - firstDow + 1 + i}</button>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = toIsoDate(year, month, d);
        const cls = ["day"];
        if (iso === selectedDate) cls.push("selected");
        if (iso === todayIso) cls.push("today");
        cells += `<button type="button" class="${cls.join(" ")}" data-date="${iso}">${d}</button>`;
      }
      const trailing = (7 - ((firstDow + daysInMonth) % 7)) % 7;
      for (let i = 1; i <= trailing; i++) {
        cells += `<button type="button" class="day other-month" disabled>${i}</button>`;
      }

      dateCal.innerHTML = `
        <div class="date-calendar-head">
          <button type="button" id="cal-prev" aria-label="${tr("前の月")}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <span class="ym">${LANG === "en" ? `${["January","February","March","April","May","June","July","August","September","October","November","December"][month]} ${year}` : `${year}年${month + 1}月`}</span>
          <button type="button" id="cal-next" aria-label="${tr("次の月")}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="date-calendar-body">
          <div class="date-calendar-grid">
            ${DOW_LABELS.map((l) => `<div class="dow">${l}</div>`).join("")}
            ${cells}
          </div>
        </div>
        <div class="date-calendar-footer">
          <button type="button" class="btn-ghost btn-small" id="cal-today">${tr("今日")}</button>
          <button type="button" class="btn-ghost btn-small" id="cal-clear">${tr("指定なし")}</button>
        </div>
      `;

      document.getElementById("cal-prev").addEventListener("click", (e) => {
        e.stopPropagation();
        calCursor = new Date(year, month - 1, 1);
        renderCalendar();
      });
      document.getElementById("cal-next").addEventListener("click", (e) => {
        e.stopPropagation();
        calCursor = new Date(year, month + 1, 1);
        renderCalendar();
      });
      document.getElementById("cal-today").addEventListener("click", (e) => {
        e.stopPropagation();
        selectedDate = todayIso;
        calCursor = new Date(today.getFullYear(), today.getMonth(), 1);
        updateDateDisplay();
        dateCal.hidden = true;
      });
      document.getElementById("cal-clear").addEventListener("click", (e) => {
        e.stopPropagation();
        selectedDate = "";
        updateDateDisplay();
        dateCal.hidden = true;
      });
      dateCal.querySelectorAll("button.day[data-date]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          selectedDate = btn.dataset.date;
          updateDateDisplay();
          dateCal.hidden = true;
        });
      });

      positionCalendar();
    }

    dateBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const willOpen = dateCal.hidden;
      dateCal.hidden = !dateCal.hidden;
      if (willOpen) renderCalendar();
    });
    window.addEventListener("resize", () => { if (!dateCal.hidden) positionCalendar(); });
    document.addEventListener("click", (e) => {
      if (!dateCal.hidden && !dateCal.contains(e.target) && e.target !== dateBtn && !dateBtn.contains(e.target)) {
        dateCal.hidden = true;
      }
    });

    function renderDropdown() {
      const v = locInput.value.trim().toLowerCase();
      const remoteMatches = v ? REMOTE_OPTIONS.filter((opt) => opt.toLowerCase().includes(v)) : REMOTE_OPTIONS;
      const prefMatches = v ? PREF_OPTIONS.filter((opt) => opt.toLowerCase().includes(v)) : PREF_OPTIONS;
      if (!remoteMatches.length && !prefMatches.length) { dropdown.hidden = true; return; }
      const optBtn = (opt) => `<button type="button" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`;
      dropdown.innerHTML =
        remoteMatches.map(optBtn).join("") +
        (remoteMatches.length && prefMatches.length ? `<div class="loc-dropdown-sep"></div>` : "") +
        prefMatches.map(optBtn).join("");
      dropdown.hidden = false;
      dropdown.querySelectorAll("button").forEach((btn) => {
        // mousedown(blurより先に発火)で選択することで、inputのblurによって
        // ドロップダウンが閉じる前にクリックを確定させる。
        btn.addEventListener("mousedown", (e) => {
          e.preventDefault();
          locInput.value = btn.dataset.value;
          dropdown.hidden = true;
        });
      });
    }
    locInput.addEventListener("focus", renderDropdown);
    locInput.addEventListener("input", renderDropdown);
    locInput.addEventListener("blur", () => { dropdown.hidden = true; });

    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("search-q").value.trim();
      const loc = locInput.value.trim();
      const method = document.getElementById("search-method").value;
      const date = selectedDate;
      const tier = document.getElementById("search-tier").value;
      const params = new URLSearchParams();
      if (q) params.set("q", q);
      if (loc) params.set("loc", loc);
      if (method) params.set("method", method);
      if (date) params.set("date", date);
      if (tier) params.set("tier", tier);
      const qs = params.toString();
      location.hash = "#list" + (qs ? "?" + qs : "");
    });
  }

  function viewList(query) {
    const root = document.getElementById("view-root");
    const q = (query && query.get("q")) || "";
    const loc = (query && query.get("loc")) || "";
    const method = (query && query.get("method")) || "";
    const dateFrom = (query && query.get("date")) || "";
    const tier = (query && query.get("tier")) || "";
    const hasSearch = !!(q || loc || method || dateFrom || tier);
    const backParams = new URLSearchParams();
    if (q) backParams.set("q", q);
    if (loc) backParams.set("loc", loc);
    if (method) backParams.set("method", method);
    if (dateFrom) backParams.set("date", dateFrom);
    if (tier) backParams.set("tier", tier);
    const backQs = backParams.toString();
    const chips = [
      q ? `${tr("検索キーワード")}: <strong class="mono">${escapeHtml(q)}</strong>` : "",
      loc ? `${tr("場所")}: <strong class="mono">${escapeHtml(loc)}</strong>` : "",
      method ? `${tr("決済方法")}: <strong class="mono">${escapeHtml(payInfo(method).label)}</strong>` : "",
      dateFrom ? `${tr("勤務日(以降)")}: <strong class="mono">${escapeHtml(dateFrom)}</strong>` : "",
      tier ? `${tr("報酬の目安")}: <strong class="mono">${escapeHtml(rewardTierLabels()[tier] || tier)}</strong>` : "",
    ].filter(Boolean).join(" ・ ");
    root.innerHTML = `
      <div class="page-head">
        <h1>${tr("求人一覧")}</h1>
        <div class="sub">${hasSearch ? tr("検索条件に一致する求人の一覧です。") : tr("求人一覧です。")}</div>
      </div>
      ${hasSearch ? `
        <div class="card" style="margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <div style="font-size:13.5px;">${chips}</div>
          <a href="#search${backQs ? "?" + backQs : ""}" class="btn-ghost btn-small" style="text-decoration:none;">${tr("検索条件を変更")}</a>
        </div>
      ` : ""}
      <div class="list-filter">
        <label for="filter-select" style="margin:0;">${tr("表示")}</label>
        <select id="filter-select">
          <option value="open">${tr("募集中のみ")}</option>
          <option value="all">${tr("すべて表示")}</option>
        </select>
      </div>
      <div class="job-list" id="job-list"></div>
    `;

    function renderList() {
      const filter = document.getElementById("filter-select").value;
      const qLower = q.toLowerCase();
      const locLower = loc.toLowerCase();
      const dateFromTime = dateFrom ? new Date(dateFrom).getTime() : null;
      const tierById = tier ? computeRewardTiers() : null;
      const filtered = JOBS.filter((j) => {
        if (filter === "open" && !j.isOpen) return false;
        if (qLower && !(j.title + " " + j.description + " " + j.location).toLowerCase().includes(qLower)) return false;
        if (locLower && !j.location.toLowerCase().includes(locLower)) return false;
        if (method && j.payMethod !== method) return false;
        if (tierById && tierById[j.id] !== tier) return false;
        if (dateFromTime !== null) {
          if (!j.workDate) return false;
          const jobTime = new Date(j.workDate).getTime();
          if (isNaN(jobTime) || jobTime < dateFromTime) return false;
        }
        return true;
      }).sort((a, b) => b.createdAt - a.createdAt);
      const listEl = document.getElementById("job-list");
      // 求人5件おきに広告バナーを1枠差し込む(ただし一覧の最後には付けない)。
      const AD_INTERVAL = 5;
      listEl.innerHTML = filtered.length
        ? filtered.map((j, i) => {
            const showAd = (i + 1) % AD_INTERVAL === 0 && i !== filtered.length - 1;
            return jobCardHtml(j) + (showAd ? adBannerHtml() : "");
          }).join("")
        : JOBS.length
          ? `<div class="empty">${tr("該当する求人が見つかりません。")}</div>`
          : `<div class="empty">${tr("まだ求人がありません。最初の求人を投稿してみましょう。")}</div>`;
    }

    document.getElementById("filter-select").addEventListener("change", renderList);
    renderList();
  }

      emailGateEl.hidden = !(method === "card" && !hasEmailAuth());

  function mountChat(jobId, otherId, otherLabel) {
    document.getElementById("chat-title").textContent = LANG === "en" ? `Chat with ${otherLabel}` : (otherLabel + " とのチャット");
    const key = roomKey(jobId, currentAccountId, otherId);
    const log = document.getElementById("chat-log");

    function renderLog() {
      const msgs = MESSAGES[key] || [];
      log.innerHTML = msgs.length
        ? msgs.map((m) => `
            <div class="bubble ${m.fromId === currentAccountId ? "mine" : "theirs"}">
              ${escapeHtml(m.text)}
              <time>${fmtDate(m.at)}</time>
            </div>
          `).join("")
        : `<div class="chat-empty">${tr("まだメッセージはありません。最初のメッセージを送ってみましょう。")}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    async function send() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      try {
        await sendMessage(jobId, otherId, text);
        renderLog();
      } catch (err) {
        input.value = text;
        toast((err && err.message) || tr("送信に失敗しました。"), "error");
      }
    }

    document.getElementById("chat-send").addEventListener("click", send);
    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
    renderLog();
  }
