  body {

  /* ---------- shell ---------- */
  .masthead {

  /* ロゴ。ダルマ(七転び八起き)を名前の左に置く。
     画像が読めない環境でも、文字だけで成立するようにしてある。 */
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    /* Dela Gothic One は太さが1種類しかないので、font-weight は 400 のまま使う
       (700 を指定するとブラウザが疑似的に太らせてにじむ)。
       読み込めなかったときのために、後ろに通常の書体を残してある。 */
    font-family: "Dela Gothic One", "IBM Plex Sans", sans-serif;
    font-weight: 400;
    font-size: 21px;
    letter-spacing: 0.01em;
    white-space: nowrap;
    text-decoration: none;
    font-synthesis: none;
  }
  .wordmark span { color: var(--accent); }
  .wordmark::before {
    content: "";

    height: 30px;

  /* 背景のごく薄い地紋。読みやすさを損なわない濃さに抑え、
     スクロールしても動かないよう画面に固定する。 */
  body::before {
    content: "";
    position: fixed;
    left: 50%;
    top: 54%;
    width: min(100vw, 760px);
    aspect-ratio: 509 / 512;
    transform: translate(-50%, -50%);
    background: url("daruma.png") center / contain no-repeat;
    opacity: 0.06;
    z-index: -1;
    pointer-events: none;

  /* 暗い背景では少しだけ濃くしないと沈んで見えなくなる */
  :root[data-theme="dark"] body::before { opacity: 0.10; }

    :root:not([data-theme="light"]) body::before { opacity: 0.10; }

  /* 画像を減らす設定の人には出さない */

  /* ---------- 検索ページの検索バー ---------- */
  .toolbar {

  /* datetime-local入力(投稿ページの勤務日時)を大きく、タップしやすく表示する */
  input[type="datetime-local"] {

  /* ---------- 検索ページの独自カレンダー(勤務日) ---------- */
  .date-field { position: relative; }
  .date-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: var(--surface);

  .date-calendar {
    position: absolute;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);

  .date-calendar-head button {

    justify-content: center;

  /* ---------- 求人一覧の絞り込みパネル ---------- */
  .filter-panel { margin-bottom: 18px; }
  .filter-toggle {

  /* 以前はFAB(左下の「+」)に最後の求人が隠れないよう .job-list 自体に
     大きめの下余白を付けていたが、求人リストがページ中ほどにも置かれる
     ようになり余白が不自然に見えるため撤去。FAB分の逃げは main の
     padding-bottom(80px)で確保している。 */
  .job-list { display: flex; flex-direction: column; gap: 12px; }
  .job-card {
    display: block;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    transition: box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .job-card.is-closed { opacity: 0.75; }
  .job-card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(37, 87, 167, 0.12); }
  .job-card .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--accent-strong); }
  .job-card.has-image { display: flex; gap: 14px; align-items: flex-start; }
  .job-card-body { flex: 1; min-width: 0; }

    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 3px;
    background: var(--surface-2);
    color: var(--text-dim);

  .pill.hired { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent-strong); }
  .pill.anon { background: var(--privacy-bg); color: var(--privacy); }

  .payment-note {
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--privacy-bg);
    border: 1px solid color-mix(in srgb, var(--privacy) 35%, transparent);
    border-radius: var(--radius);
    padding: 10px 12px;
    line-height: 1.6;
  }
  .payment-note strong { color: var(--privacy); }

  .site-footer {
    max-width: 880px;
    margin: 0 auto;
    padding: 10px 20px 40px;
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.7;

  .meta-item { font-size: 13px; color: var(--text); }
  .meta-label {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 1px;

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 50px 20px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 14px;
  }

  .back-link {
    display: inline-block;
    font-size: 13px;
    color: var(--text-dim);
    text-decoration: none;
    margin-bottom: 14px;

  .back-link:hover { color: var(--text); }

  .addr-chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    background: var(--surface-2);
    border-radius: 5px;

  .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }

  .rating-badge {
    display: inline-block;
    font-size: 12px;

    display: flex;

    padding: 12px 0;

  .chat-shell {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 340px;

  .chat-empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; }

  /* ---------- toast + modal ---------- */
  #toast-root {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 100;
    width: min(92vw, 420px);
  }
  .toast {
    background: var(--text);
    color: var(--bg);
    padding: 11px 16px;
    border-radius: var(--radius);
    font-size: 13.5px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);

  .toast.error { background: var(--danger); color: #fff; }
  .toast.success { background: var(--teal); color: #06251d; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 26, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 90;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);

    max-width: 380px;
    width: 100%;
  }
  .modal-box-lg { max-width: 480px; padding: 32px; }
  .modal-box p { font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    .masthead { padding-inline: 16px; }
    main { padding-inline: 16px; }

  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fakeAddress(seed) {
    const rnd = mulberry32(seed);

    for (let i = 0; i < 40; i++) h += Math.floor(rnd() * 16).toString(16);

  }

  // 外部のサービスとは一切関係しない。
  function hashSeed(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    return h >>> 0;
  }

  // 求人に添付する画像は、そのままだと容量が大きすぎてブラウザの保存領域を
  // 圧迫するため、長辺が900pxを超える場合は縮小し、JPEGとして圧縮してから
  // data URL(文字列)として保存する。
  function resizeImageForStorage(file, maxDim = 900, quality = 0.72) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error(tr("画像の読み込みに失敗しました。")));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error(tr("画像の読み込みに失敗しました。対応していない形式の可能性があります。")));
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function rewardTierLabels() { return { high: tr("高収入"), normal: tr("普通"), low: tr("低収入") }; }
  // 求人ごとの報酬を「高収入・普通・低収入」に分類する。
  // 報酬が高い順に並べ、上位1割を高収入、下位2割を低収入、残りの真ん中7割を普通とする。
  // 母数が少ないとき(3件未満)はすべて「普通」扱いにする。
  function computeRewardTiers() {
    const tierById = {};
    const n = JOBS.length;
    if (n < 3) {
      JOBS.forEach((j) => { tierById[j.id] = "normal"; });
      return tierById;
    }
    const sorted = [...JOBS].sort((a, b) => a.reward - b.reward); // 昇順(安い順)
    const lowCount = Math.max(1, Math.round(n * 0.2));
    const highCount = Math.max(1, Math.round(n * 0.1));
    sorted.forEach((j, i) => {
      if (i < lowCount) tierById[j.id] = "low";
      else if (i >= n - highCount) tierById[j.id] = "high";
      else tierById[j.id] = "normal";
    });
    return tierById;
  }

  function myAccounts() {

  // アカウントの削除。自分が投稿した求人はすべて削除し(応募・チャットもDB側で
  // 連動して削除される)、他人の求人への応募のうち採用されていないものは
  // 取り下げる。アカウント自体は完全には消さず、表示名などだけを
  // 「削除済みアカウント」に置き換える(ソフトデリート) — 完全に消すと、
  // 他人が投稿した求人の「採用者」欄などからこのアカウントが参照できなくなり
  // エラーになるため。自分のアカウントが0個になった場合は、新しい
  // 「匿名ゲスト」を自動的に作り直す(最低1つのアカウントが無いと使えないため)。
  async function deleteAccount(id) {
    const acct = getAccount(id);
    if (!acct) throw new Error(tr("アカウントが見つかりません。"));
    if (!acct.mine) throw new Error(tr("自分のアカウントだけ削除できます。"));

    const { collection, doc, updateDoc, getDocs, query, where } = fsMod;

    // 自分が投稿した求人をすべて削除する。Firestoreには外部キーの
    // カスケード削除が無いため、紐づく応募・チャットも自分の手で
    // 一緒に削除する(Supabase版ではDB側のON DELETE CASCADEに
    // 任せていた部分)。
    const myJobIds = JOBS.filter((j) => j.employerId === id).map((j) => j.id);
    if (myJobIds.length) {
      try {
        await batchDeleteRefs(myJobIds.map((jid) => doc(db, "jobs", jid)));
        for (const chunk of chunkArray(myJobIds, 30)) {
          const appSnap = await getDocs(query(collection(db, "applications"), where("job_id", "in", chunk)));
          await batchDeleteRefs(appSnap.docs.map((d) => d.ref));
          const msgSnap = await getDocs(query(collection(db, "messages"), where("job_id", "in", chunk)));
          await batchDeleteRefs(msgSnap.docs.map((d) => d.ref));
        }
      } catch (e) {
        throw new Error(tr("投稿した求人の削除に失敗しました。"));
      }
    }

    // 採用済みのものは相手側の「採用者」表示のために残し、それ以外の応募だけ取り下げる。
    const hiredJobIds = new Set(JOBS.filter((j) => j.hiredId === id).map((j) => j.id));
    try {
      const appSnap = await getDocs(query(collection(db, "applications"), where("applicant_id", "==", id)));
      const toDrop = appSnap.docs.filter((d) => !hiredJobIds.has(d.data().job_id));
      await batchDeleteRefs(toDrop.map((d) => d.ref));
    } catch (e) {
      throw new Error(tr("応募の取り下げに失敗しました。"));
    }

    try {
      await updateDoc(doc(db, "accounts", id), {
        is_deleted: true, name: tr("削除済みアカウント"), bio: "", skills: "", role: "",
      });
    } catch (e) {
      throw new Error(tr("アカウントの削除に失敗しました。"));
    }

    for (let i = JOBS.length - 1; i >= 0; i--) {
      if (JOBS[i].employerId === id) JOBS.splice(i, 1);
    }
    JOBS.forEach((j) => {
      j.applicants = j.applicants.filter((a) => a.accountId !== id || j.hiredId === id);
    });
    acct.isDeleted = true;
    acct.name = tr("削除済みアカウント");
    acct.bio = "";
    acct.skills = "";
    acct.role = "";

    if (currentAccountId === id) {
      const remaining = myAccounts().filter((a) => a.id !== id);
      currentAccountId = remaining.length ? remaining[0].id : (await createDefaultGuestAccount()).id;
    }
    refreshGuestFlag();
    persistCurrentAccountId();
  }

    if (acct.id === job.employerId) throw new Error(tr("自分が投稿した求人には応募できません。"));
    if (!job.isOpen) throw new Error(tr("この求人の募集は終了しています。"));
    if (job.applicants.some((a) => a.accountId === acct.id)) throw new Error(tr("すでに応募済みです。"));
    // 応募は常に無料。支払いが発生するのは採用が決まったときの報酬のみ。
    const { collection, addDoc } = fsMod;
    const appliedAt = new Date().toISOString();
    try {
      await addDoc(collection(db, "applications"), { job_id: job.id, applicant_id: acct.id, applied_at: appliedAt });
    } catch (e) {
      throw new Error(tr("応募に失敗しました。"));
    }
    job.applicants.push({ accountId: acct.id, appliedAt });
  }

  async function hireApplicant(jobId, applicantId) {
    const job = getJob(jobId);
    if (me().id !== job.employerId) throw new Error(tr("採用できるのは求人を投稿した投稿者のみです。"));
    if (!job.isOpen) throw new Error(tr("この求人はすでに締め切られています。"));
    // 採用の確定はセキュリティルールで「求人の投稿者本人だけ」に制限している。
    const { doc, updateDoc } = fsMod;
    try {
      await updateDoc(doc(db, "jobs", job.id), { is_open: false, hired_id: applicantId });
    } catch (e) {
      throw new Error(tr("採用処理に失敗しました。"));
    }
    job.isOpen = false;
    job.hiredId = applicantId;
    // 報酬の受け渡しはこのサイトの外で当事者同士が行う。
    // このサイトは掲載と連絡の場であり、支払いには一切関与しない。
  }

  // 求人ごとの「評価(レビュー)」。採用が決まった求人について、
  // その求人の投稿者⇔採用者の当事者同士が、お互いを1〜5の星で評価できる。
  // 匿名のままでも、過去の取引実績(星評価)が見えるようにすることで、
  // 使い捨てアカウントによる詐欺的な行為を多少なりとも抑止する狙い。
  function hasReviewed(jobId, fromId) {
    return REVIEWS.some((r) => r.job_id === jobId && r.from_id === fromId);
  }

  // 指定したアカウントが「評価された側」になっているレビューをもとに、
  // 平均評価と件数を計算する。レビューが1件も無ければnullを返す。
  function accountRatingStats(accountId) {
    const list = REVIEWS.filter((r) => r.to_id === accountId);
    if (!list.length) return null;
    const avg = list.reduce((sum, r) => sum + r.rating, 0) / list.length;
    return { avg, count: list.length };
  }

  function ratingBadgeHtml(accountId) {
    const stats = accountRatingStats(accountId);
    if (!stats) return "";
    return `<span class="rating-badge">★${stats.avg.toFixed(1)} (${stats.count})</span>`;
  }

  async function submitReview(jobId, toId, rating, comment) {
    const job = getJob(jobId);
    const acct = me();
    const participantIds = [job.employerId, job.hiredId];
    if (!job.hiredId || !participantIds.includes(acct.id) || !participantIds.includes(toId) || acct.id === toId) {
      throw new Error(tr("この求人の当事者同士でのみ評価できます。"));
    }
    if (!Number.isInteger(rating) || rating < 1 || rating > 5) {
      throw new Error(tr("評価は星1〜5個の範囲で指定してください。"));
    }
    if (hasReviewed(jobId, acct.id)) throw new Error(tr("この求人についてはすでに評価済みです。"));
    const { doc, setDoc } = fsMod;
    const reviewId = `${jobId}_${acct.id}`;
    const payload = {
      job_id: jobId,
      from_id: acct.id,
      to_id: toId,
      rating,
      comment: (comment || "").slice(0, 500),
      created_at: new Date().toISOString(),
    };
    try {
      await setDoc(doc(db, "reviews", reviewId), payload);
    } catch (e) {
      throw new Error(tr("評価の送信に失敗しました。"));
    }
    REVIEWS.push({ id: reviewId, ...payload });
  }

  // 求人詳細ページの下部に表示する、評価フォーム/評価結果の描画。
  // 投稿者・採用者どちらのビューからも共通で呼べるよう独立した関数にしている。
  function renderReviewSection(job) {
    const container = document.getElementById("review-section");
    if (!container) return;
    const acct = me();
    const participantIds = [job.employerId, job.hiredId].filter(Boolean);
    if (!job.hiredId || !participantIds.includes(acct.id)) {
      container.innerHTML = "";
      return;
    }
    const otherId = acct.id === job.employerId ? job.hiredId : job.employerId;
    const other = getAccount(otherId);
    const otherStats = accountRatingStats(otherId);
    const myExistingReview = REVIEWS.find((r) => r.job_id === job.id && r.from_id === acct.id);

    let html = `<div class="card" style="margin-top:18px;">`;
    html += `<div class="section-title">${LANG === "en" ? `Review ${escapeHtml(other.name)}` : `${escapeHtml(other.name)}を評価する`}</div>`;
    html += `<div style="font-size:13px; color:var(--text-dim); margin-bottom:12px;">${LANG === "en" ? "Overall rating: " : "総合評価: "}${otherStats ? `★${otherStats.avg.toFixed(1)} (${otherStats.count})` : tr("まだ評価がありません")}</div>`;

    if (myExistingReview) {
      html += `
        <div style="font-size:14px;">
          ${tr("あなたの評価")}: ${"★".repeat(myExistingReview.rating)}${"☆".repeat(5 - myExistingReview.rating)}
          ${myExistingReview.comment ? `<div style="margin-top:6px; font-size:13px; color:var(--text-dim); white-space:pre-wrap;">${escapeHtml(myExistingReview.comment)}</div>` : ""}
        </div>
      `;
    } else {
      html += `
        <select id="review-rating" style="margin-bottom:8px;">
          ${[5, 4, 3, 2, 1].map((n) => `<option value="${n}">${"★".repeat(n)}${"☆".repeat(5 - n)}</option>`).join("")}
        </select>
        <textarea id="review-comment" rows="2" maxlength="500" placeholder="${tr("コメント(任意)")}" style="width:100%; display:block; margin-bottom:8px;"></textarea>
        <button type="button" class="btn-accent btn-small" id="review-submit-btn">${tr("評価を送信する")}</button>
      `;
    }
    html += `</div>`;
    container.innerHTML = html;

    const submitBtn = document.getElementById("review-submit-btn");
    if (submitBtn) {
      submitBtn.addEventListener("click", async () => {
        submitBtn.disabled = true;
        const rating = Number(document.getElementById("review-rating").value);
        const comment = document.getElementById("review-comment").value.trim();
        try {
          await submitReview(job.id, otherId, rating, comment);
          toast(tr("評価を送信しました。"), "success");
          renderReviewSection(job);
        } catch (err) {
          toast((err && err.message) || tr("評価の送信に失敗しました。"), "error");
          submitBtn.disabled = false;
        }
      });
    }
  }

  async function closeJob(jobId) {
    const job = getJob(jobId);
    const acct = me();
    if (acct.id !== job.employerId) throw new Error(tr("締め切れるのは求人を投稿した投稿者のみです。"));
    if (!job.isOpen) throw new Error(tr("すでに締め切られています。"));
    const { doc, updateDoc } = fsMod;
    try {
      await updateDoc(doc(db, "jobs", job.id), { is_open: false });
    } catch (e) {
      throw new Error(tr("更新に失敗しました。"));
    }
    job.isOpen = false;
  }

  async function sendMessage(jobId, toId, text) {
    const { collection, addDoc } = fsMod;
    const at = new Date().toISOString();
    try {
      await addDoc(collection(db, "messages"), { job_id: jobId, from_id: currentAccountId, to_id: toId, text, created_at: at });
    } catch (e) {
      throw new Error(tr("送信に失敗しました。"));
    }
    const key = roomKey(jobId, currentAccountId, toId);
    if (!MESSAGES[key]) MESSAGES[key] = [];
    MESSAGES[key].push({ fromId: currentAccountId, text, at });
  }

  /* ---------------------------------------------------------------- */
  /* Firestoreからの読み込み(全員で共有される本物のデータベース)。       */
  /* どのアカウントを選んでいるかの記憶と、オンチェーン送金の記録だけは  */
  /* このブラウザだけのローカルな情報として別に保存する。                */
  /* ---------------------------------------------------------------- */

  const CURRENT_ACCOUNT_KEY = "jobchain-current-account-v1";
  function persistCurrentAccountId() {
    try { localStorage.setItem(CURRENT_ACCOUNT_KEY, currentAccountId); } catch {}
  }

  // メールアドレスも秘密鍵も不要な「匿名認証」でサインインする。これにより、
  // このブラウザのセッションごとに本物の(なりすましのできない)IDが発行され、
  // セキュリティルールが「自分の作ったアカウント・求人だけ書き換えられる」
  // を判定できるようになる。
  async function ensureAuth() {
    await initFirebase();
    const user = await new Promise((resolve, reject) => {
      const unsubscribe = authMod.onAuthStateChanged(
        auth,
        (u) => {
          unsubscribe();
          if (u) { resolve(u); return; }
          authMod.signInAnonymously(auth)
            .then((cred) => resolve(cred.user))
            .catch(reject);
        },
        (err) => { unsubscribe(); reject(err); }
      );
    });
    MY_AUTH_UID = user.uid;
  }

  // 起動時に、アカウント・求人・応募・メッセージをすべてFirestoreから読み込み、
  // 既存の描画コードが読むACCOUNTS/JOBS/MESSAGESのキャッシュに反映する。
  async function fetchAllData() {
    const { collection, getDocs, query, orderBy, where } = fsMod;

    const [accSnap, jobSnap, appSnap, reviewSnap] = await Promise.all([
      getDocs(query(collection(db, "accounts"), orderBy("created_at", "asc"))),
      getDocs(query(collection(db, "jobs"), orderBy("created_at", "desc"))),
      getDocs(collection(db, "applications")),
      getDocs(collection(db, "reviews")),
    ]);

    // レビューは(メッセージと違って)誰が読んでも良い情報(お互いの信頼度の
    // 目安として公開する評価)なので、求人・アカウントと同じく絞り込み無しで
    // 全件取得する。
    REVIEWS.length = 0;
    REVIEWS.push(...reviewSnap.docs.map((d) => ({ id: d.id, ...d.data() })));

    ACCOUNTS.length = 0;
    ACCOUNTS.push(...accSnap.docs.map((d) => mapAccountRow({ id: d.id, ...d.data() })));

    JOBS.length = 0;
    JOBS.push(...jobSnap.docs.map((d) => mapJobRow({ id: d.id, ...d.data() })));
    const jobsById = new Map(JOBS.map((j) => [j.id, j]));
    appSnap.docs.forEach((d) => {
      const row = d.data();
      const job = jobsById.get(row.job_id);
      if (job) job.applicants.push(mapApplicationRow(row));
    });

    // メッセージは「自分が関わっているもの」だけを読み込む(プライバシーのため
    // Firestoreのセキュリティルールでもそう制限している)。ルール上、
    // クエリ自体が絞り込まれている必要があるため、自分の(サブアカウント
    // 含む)口座ID宛て/発の2種類のクエリに分けて取得し、あとで合流させる。
    const myIds = ACCOUNTS.filter((a) => a.mine).map((a) => a.id);
    const msgRows = [];
    const seenMsgIds = new Set();
    for (const chunk of chunkArray(myIds, 30)) {
      const [fromSnap, toSnap] = await Promise.all([
        getDocs(query(collection(db, "messages"), where("from_id", "in", chunk))),
        getDocs(query(collection(db, "messages"), where("to_id", "in", chunk))),
      ]);
      [...fromSnap.docs, ...toSnap.docs].forEach((d) => {
        if (seenMsgIds.has(d.id)) return;
        seenMsgIds.add(d.id);
        msgRows.push(d.data());
      });
    }
    msgRows.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    Object.keys(MESSAGES).forEach((k) => delete MESSAGES[k]);
    msgRows.forEach((row) => {
      const key = roomKey(row.job_id, row.from_id, row.to_id);
      if (!MESSAGES[key]) MESSAGES[key] = [];
      MESSAGES[key].push({ fromId: row.from_id, text: row.text, at: row.created_at });
    });

    // まだ1つも無ければ(初回訪問、または以前すべて削除した場合)
    // 「匿名ゲスト」を自動的に作る。
    let mine = myAccounts();
    if (!mine.length) { await createDefaultGuestAccount(); mine = myAccounts(); }
    refreshGuestFlag();

    // 前回どちらを使っていたかを覚えておき、ログイン状態を保つ。
    let savedId = null;
    try { savedId = localStorage.getItem(CURRENT_ACCOUNT_KEY); } catch {}
    const savedAccount = savedId && mine.find((a) => a.id === savedId);
    currentAccountId = savedAccount ? savedAccount.id : mine[0].id;
    persistCurrentAccountId();
  }

  function currentRoute() {
    const raw = (location.hash || "#list").slice(1);
    const [hash, queryStr] = raw.split("?");
    if (hash.startsWith("job-")) return { name: "job", id: hash.slice(4), query: new URLSearchParams(queryStr || "") };
    if (["search", "list", "post", "dashboard", "profile"].includes(hash)) {
      return { name: hash, query: new URLSearchParams(queryStr || "") };
    }
    return { name: "list", query: new URLSearchParams() };
  }

  function renderShell() {
    const route = currentRoute();
    document.querySelectorAll("#nav-tabs a").forEach((a) => {
      a.classList.toggle("active", a.dataset.tab === route.name || (route.name === "job" && a.dataset.tab === "list"));
    });
    document.getElementById("fab-post").hidden = route.name === "post";
    const acct = me();
    const btn = document.getElementById("account-btn");
    btn.classList.toggle("is-guest", !!acct.isGuest);
    if (acct.isGuest) {
      btn.innerHTML = `<span class="login-label">${tr("ログイン")}</span>`;
    } else {
      btn.innerHTML = `
        <svg class="avatar" id="account-avatar" viewBox="0 0 24 24">${avatarSvg(acct.address)}</svg>
        <span class="who">

        </span>

  function renderAccountPanel() {
    const panel = document.getElementById("account-panel");
    const mine = myAccounts();
    // 通常ここが空になることはない(起動時に必ず1つ作る)が、
    // 万一空でもパネルを開いた瞬間に落ちないようにしておく。
    if (!mine.length) { panel.innerHTML = `<div class="hint-line">${tr("読み込み中…")}</div>`; return; }
    const guest = mine[0];
    const samples = mine.slice(1);

    function rowHtml(a) {
      return `
        <button class="account-row ${a.id === currentAccountId ? "current" : ""}" data-switch="${a.id}">
          <svg class="avatar" viewBox="0 0 24 24">${avatarSvg(a.address)}</svg>
          <span class="who">
            <div class="name">${escapeHtml(a.name)} ${a.role === "employer" ? tr("(投稿者)") : a.role === "applicant" ? tr("(応募者)") : ""}</div>
            <div class="addr mono">${shortAddr(a.address)}</div>
          </span>
        </button>
      `;

    panel.innerHTML = `
      <div class="hint-line">${tr("ログイン不要 — 匿名ゲストのまま投稿・応募できます。名前を付けて使いたいときだけ登録してください。")}</div>
      ${rowHtml(guest)}
      ${samples.length ? `
        <div class="hint-line" style="border:none; border-top:1px solid var(--border); margin:6px 0 0; padding:10px 8px 6px;">${tr("登録したアカウント")}</div>
        ${samples.map(rowHtml).join("")}
      ` : ""}
      ${loggedIn ? `
        <button class="btn-ghost btn-small" id="account-logout" style="width:100%; margin-top:10px;" type="button">${tr("ログアウト(匿名ゲストに戻る)")}</button>
      ` : ""}
      ${samples.length ? "" : `
        <div style="border-top:1px solid var(--border); margin-top:10px; padding-top:10px;">
          <button class="btn-ghost btn-small" id="signup-toggle" style="width:100%;" type="button">${tr("＋ 新規登録(名前を付けて使う)")}</button>
        </div>
      `}
      <div style="border-top:1px solid var(--border); margin-top:10px; padding-top:10px;">
        <div style="font-size:11px; color:var(--text-dim); padding:0 8px;">${tr("アカウントは「匿名ゲスト」ともう1つまでです。どちらもこの端末にだけ保存されるため、ブラウザのデータを消すと戻れなくなります。")}</div>
      </div>
    `;
    panel.querySelectorAll("[data-switch]").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentAccountId = btn.dataset.switch;
        persistCurrentAccountId();

        route();

    const logoutBtn = document.getElementById("account-logout");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        currentAccountId = guest.id;
        persistCurrentAccountId();
        panel.hidden = true;
        toast(tr("ログアウトしました。"), "success");
        route();
      });

    const signupBtn = document.getElementById("signup-toggle");
    if (signupBtn) {
      signupBtn.addEventListener("click", () => {
        panel.hidden = true;
        openSignupModal();

  // 画面中央に大きく表示するモーダルで行う。
  function openSignupModal() {
    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-overlay" id="signup-modal-overlay">
        <div class="modal-box modal-box-lg">
          <h2 style="font-size:20px; margin-bottom:14px;">${tr("新規登録")}</h2>
          <p style="font-size:13.5px; color:var(--text-dim); line-height:1.7; margin-bottom:20px;">${tr("メールアドレスもパスワードも秘密鍵も不要です。表示名(任意)を入れるだけでアカウントが作られ、自動的にログインします。いつでもログアウトして匿名ゲストに戻れます。作れるのは「匿名ゲスト」のほかに1つまでです。")}</p>
          <form id="signup-form" class="stack">
            <div class="field" style="margin-bottom:0;">
              <label for="signup-name">${tr("表示名(任意)")}</label>
              <input id="signup-name" placeholder="${tr("空欄なら「新規ユーザー」")}" />
            </div>
            <div class="modal-actions" style="margin-top:6px;">
              <button type="button" class="btn-ghost" id="signup-cancel">${tr("キャンセル")}</button>
              <button type="submit" class="btn-accent">${tr("登録してログイン")}</button>
            </div>
          </form>
        </div>
      </div>
    `;
    const close = () => { root.innerHTML = ""; };
    document.getElementById("signup-modal-overlay").addEventListener("click", (e) => {
      if (e.target.id === "signup-modal-overlay") close();
    });
    document.getElementById("signup-cancel").addEventListener("click", close);
    document.getElementById("signup-name").focus();
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("signup-name").value.trim();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      try {
        const account = await createAccount({ name });

        route();
      } catch (err) {
        if (submitBtn) submitBtn.disabled = false;
        toast((err && err.message) || tr("登録に失敗しました。"), "error");
      }
    });
  }

            <form id="search-form" class="toolbar toolbar-lg">
              <input type="search" id="search-q" placeholder="${tr("職種・スキルなど")}" value="${escapeHtml(initialQ)}" />
              <input type="text" id="search-loc" class="loc-input" placeholder="${tr("場所を選択・入力")}" value="${escapeHtml(initialLoc)}" autocomplete="off" />
              <button type="submit" class="toolbar-search-btn" aria-label="${tr("検索")}">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              </button>
            </form>
            <div class="loc-dropdown" id="loc-dropdown" hidden></div>
          </div>
          <div class="search-filters">
            <div class="field date-field">
              <label id="search-date-label" for="search-date-btn">${tr("勤務日(以降)")}</label>
              <button type="button" id="search-date-btn" class="date-btn">
                <span id="search-date-display" class="${initialDate ? "" : "is-placeholder"}">${initialDate ? escapeHtml(fmtDateDisplay(initialDate)) : tr("指定なし")}</span>
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              </button>
            </div>
            <div class="field">
              <label for="search-tier">${tr("報酬の目安")}</label>
              <select id="search-tier">
                <option value="">${tr("すべて")}</option>
                <option value="high" ${initialRewardTier === "high" ? "selected" : ""}>${tr("高収入")}</option>
                <option value="normal" ${initialRewardTier === "normal" ? "selected" : ""}>${tr("普通")}</option>
                <option value="low" ${initialRewardTier === "low" ? "selected" : ""}>${tr("低収入")}</option>
              </select>
            </div>
          </div>
          <div class="date-calendar" id="date-calendar" hidden></div>
        </div>
      </div>
      <div style="margin-top:14px; text-align:center;">
        <a href="#list" style="font-size:13.5px; color:var(--text-dim);">${tr("キーワードなしですべての求人を見る →")}</a>
      </div>
    `;

    const locInput = document.getElementById("search-loc");
    const dropdown = document.getElementById("loc-dropdown");

    /* ---- 独自カレンダー(勤務日) ---- */
    let selectedDate = initialDate || "";
    const today = new Date();
    const todayIso = toIsoDate(today.getFullYear(), today.getMonth(), today.getDate());
    let calCursor = (() => {
      if (selectedDate) {
        const [y, m] = selectedDate.split("-").map(Number);
        return new Date(y, m - 1, 1);
      }
      return new Date(today.getFullYear(), today.getMonth(), 1);
    })();
    const dateBtn = document.getElementById("search-date-btn");
    const dateDisplay = document.getElementById("search-date-display");
    const dateCal = document.getElementById("date-calendar");
    const searchWrapper = document.getElementById("search-wrapper");
    const DOW_LABELS = LANG === "en" ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["日", "月", "火", "水", "木", "金", "土"];

    // 未選択(指定なし)の時は他のプレースホルダーと同じ薄い色、日付を選ぶと通常の文字色にする。
    function updateDateDisplay() {
      if (selectedDate) {
        dateDisplay.textContent = fmtDateDisplay(selectedDate);
        dateDisplay.classList.remove("is-placeholder");
      } else {
        dateDisplay.textContent = tr("指定なし");
        dateDisplay.classList.add("is-placeholder");
      }
    }

    // position:absoluteで検索欄全体の枠(#search-wrapper)を基準に配置する。
    // 横方向はその枠の中に収まるようにし、縦方向はボタンの下にそのまま表示する
    // (画面に収まりきらない場合は、カレンダー自体ではなくページ全体がスクロールして見える)。
    function positionCalendar() {
      const wrapperRect = searchWrapper.getBoundingClientRect();
      const btnRect = dateBtn.getBoundingClientRect();
      const calWidth = Math.min(380, wrapperRect.width);
      dateCal.style.width = calWidth + "px";

      let left = btnRect.left - wrapperRect.left;
      const maxLeft = wrapperRect.width - calWidth;
      if (left > maxLeft) left = Math.max(0, maxLeft);
      if (left < 0) left = 0;
      dateCal.style.left = left + "px";
      dateCal.style.top = (btnRect.bottom - wrapperRect.top + 8) + "px";
    }

    function renderCalendar() {
      const year = calCursor.getFullYear();
      const month = calCursor.getMonth();
      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      let cells = "";
      for (let i = 0; i < firstDow; i++) {
        cells += `<button type="button" class="day other-month" disabled>${daysInPrevMonth - firstDow + 1 + i}</button>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = toIsoDate(year, month, d);
        const cls = ["day"];
        if (iso === selectedDate) cls.push("selected");
        if (iso === todayIso) cls.push("today");
        cells += `<button type="button" class="${cls.join(" ")}" data-date="${iso}">${d}</button>`;
      }
      const trailing = (7 - ((firstDow + daysInMonth) % 7)) % 7;
      for (let i = 1; i <= trailing; i++) {
        cells += `<button type="button" class="day other-month" disabled>${i}</button>`;
      }

      dateCal.innerHTML = `
        <div class="date-calendar-head">
          <button type="button" id="cal-prev" aria-label="${tr("前の月")}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <span class="ym">${LANG === "en" ? `${["January","February","March","April","May","June","July","August","September","October","November","December"][month]} ${year}` : `${year}年${month + 1}月`}</span>
          <button type="button" id="cal-next" aria-label="${tr("次の月")}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="date-calendar-body">
          <div class="date-calendar-grid">
            ${DOW_LABELS.map((l) => `<div class="dow">${l}</div>`).join("")}
            ${cells}
          </div>
        </div>
        <div class="date-calendar-footer">
          <button type="button" class="btn-ghost btn-small" id="cal-today">${tr("今日")}</button>
          <button type="button" class="btn-ghost btn-small" id="cal-clear">${tr("指定なし")}</button>
        </div>
      `;

      document.getElementById("cal-prev").addEventListener("click", (e) => {
        e.stopPropagation();
        calCursor = new Date(year, month - 1, 1);
        renderCalendar();
      });
      document.getElementById("cal-next").addEventListener("click", (e) => {
        e.stopPropagation();
        calCursor = new Date(year, month + 1, 1);
        renderCalendar();
      });
      document.getElementById("cal-today").addEventListener("click", (e) => {
        e.stopPropagation();
        selectedDate = todayIso;
        calCursor = new Date(today.getFullYear(), today.getMonth(), 1);
        updateDateDisplay();
        dateCal.hidden = true;
      });
      document.getElementById("cal-clear").addEventListener("click", (e) => {
        e.stopPropagation();
        selectedDate = "";
        updateDateDisplay();
        dateCal.hidden = true;
      });
      dateCal.querySelectorAll("button.day[data-date]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          selectedDate = btn.dataset.date;
          updateDateDisplay();
          dateCal.hidden = true;
        });
      });

      positionCalendar();
    }

    dateBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const willOpen = dateCal.hidden;
      dateCal.hidden = !dateCal.hidden;
      if (willOpen) renderCalendar();
    });
    window.addEventListener("resize", () => { if (!dateCal.hidden) positionCalendar(); });
    document.addEventListener("click", (e) => {
      if (!dateCal.hidden && !dateCal.contains(e.target) && e.target !== dateBtn && !dateBtn.contains(e.target)) {
        dateCal.hidden = true;
      }
    });

    function renderDropdown() {
      const v = locInput.value.trim().toLowerCase();
      const remoteMatches = v ? REMOTE_OPTIONS.filter((opt) => opt.toLowerCase().includes(v)) : REMOTE_OPTIONS;
      const prefMatches = v ? PREF_OPTIONS.filter((opt) => opt.toLowerCase().includes(v)) : PREF_OPTIONS;
      if (!remoteMatches.length && !prefMatches.length) { dropdown.hidden = true; return; }
      const optBtn = (opt) => `<button type="button" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`;
      dropdown.innerHTML =
        remoteMatches.map(optBtn).join("") +
        (remoteMatches.length && prefMatches.length ? `<div class="loc-dropdown-sep"></div>` : "") +
        prefMatches.map(optBtn).join("");
      dropdown.hidden = false;
      dropdown.querySelectorAll("button").forEach((btn) => {
        // mousedown(blurより先に発火)で選択することで、inputのblurによって
        // ドロップダウンが閉じる前にクリックを確定させる。
        btn.addEventListener("mousedown", (e) => {
          e.preventDefault();
          locInput.value = btn.dataset.value;
          dropdown.hidden = true;
        });
      });
    }
    locInput.addEventListener("focus", renderDropdown);
    locInput.addEventListener("input", renderDropdown);
    locInput.addEventListener("blur", () => { dropdown.hidden = true; });

    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("search-q").value.trim();
      const loc = locInput.value.trim();
      const date = selectedDate;
      const tier = document.getElementById("search-tier").value;
      const params = new URLSearchParams();
      if (q) params.set("q", q);
      if (loc) params.set("loc", loc);
      if (date) params.set("date", date);
      if (tier) params.set("tier", tier);
      const qs = params.toString();
      location.hash = "#list" + (qs ? "?" + qs : "");
    });
  }

  function viewList(query) {
    const root = document.getElementById("view-root");
    // 検索ページから渡された条件を初期値として読み込む。
    // 以降はこのページ内の絞り込みパネルで直接変更できる。
    const init = {
      q: (query && query.get("q")) || "",
      loc: (query && query.get("loc")) || "",
      date: (query && query.get("date")) || "",
      tier: (query && query.get("tier")) || "",
      status: (query && query.get("status")) || "open",
    };
    const hasInitialFilter = !!(init.q || init.loc || init.date || init.tier);

    root.innerHTML = `
      <div class="page-head">
        <h1>${tr("求人一覧")}</h1>
        <div class="sub">${tr("気になる求人を探して、そのまま応募できます。")}</div>
      </div>
      <div class="filter-panel">
        <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="${hasInitialFilter ? "true" : "false"}" aria-controls="filter-body">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
          <span>${tr("絞り込み")}</span>
          <span class="count" id="filter-count" hidden>0</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="filter-body" id="filter-body" ${hasInitialFilter ? "" : "hidden"}>
          <div class="filter-grid">
            <div class="field">
              <label for="filter-q">${tr("キーワード")}</label>
              <input id="filter-q" type="search" value="${escapeHtml(init.q)}" placeholder="${tr("例: 草刈り、翻訳")}" />
            </div>
            <div class="field">
              <label for="filter-loc">${tr("勤務地")}</label>
              <input id="filter-loc" type="search" value="${escapeHtml(init.loc)}" placeholder="${tr("例: 東京、フルリモート")}" />
            </div>
            <div class="field">
              <label for="filter-date">${tr("勤務日(以降)")}</label>
              <input id="filter-date" type="date" value="${escapeHtml(init.date)}" />
            </div>
            <div class="field">
              <label for="filter-tier">${tr("報酬の目安")}</label>
              <select id="filter-tier">
                <option value="">${tr("すべて")}</option>
                <option value="high" ${init.tier === "high" ? "selected" : ""}>${tr("高収入")}</option>
                <option value="normal" ${init.tier === "normal" ? "selected" : ""}>${tr("普通")}</option>
                <option value="low" ${init.tier === "low" ? "selected" : ""}>${tr("低収入")}</option>
              </select>
            </div>
            <div class="field">
              <label for="filter-status">${tr("募集状況")}</label>
              <select id="filter-status">
                <option value="open" ${init.status !== "all" ? "selected" : ""}>${tr("募集中のみ")}</option>
                <option value="all" ${init.status === "all" ? "selected" : ""}>${tr("すべて表示")}</option>
              </select>
            </div>
          </div>
          <div class="filter-actions">
            <span class="filter-result" id="filter-result"></span>
            <button type="button" class="btn-ghost btn-small" id="filter-clear">${tr("条件をクリア")}</button>
          </div>
        </div>
      </div>
      <div class="job-list" id="job-list"></div>
    `;

    const toggleBtn = document.getElementById("filter-toggle");
    const bodyEl = document.getElementById("filter-body");
    const countEl = document.getElementById("filter-count");
    const resultEl = document.getElementById("filter-result");
    const qEl = document.getElementById("filter-q");
    const locEl = document.getElementById("filter-loc");
    const dateEl = document.getElementById("filter-date");
    const tierEl = document.getElementById("filter-tier");
    const statusEl = document.getElementById("filter-status");

    toggleBtn.addEventListener("click", () => {
      const open = bodyEl.hidden;
      bodyEl.hidden = !open;
      toggleBtn.setAttribute("aria-expanded", String(open));
    });

    document.getElementById("filter-clear").addEventListener("click", () => {
      qEl.value = "";
      locEl.value = "";
      dateEl.value = "";
      tierEl.value = "";
      statusEl.value = "open";
      renderList();
    });

    function renderList() {
      const q = qEl.value.trim().toLowerCase();
      const loc = locEl.value.trim().toLowerCase();
      const dateFrom = dateEl.value;
      const tier = tierEl.value;
      const status = statusEl.value;

      // 「募集中のみ」は初期値なので、絞り込みの件数には数えない。
      const activeCount = [q, loc, dateFrom, tier].filter(Boolean).length + (status === "all" ? 1 : 0);
      countEl.hidden = activeCount === 0;
      countEl.textContent = String(activeCount);

      const dateFromTime = dateFrom ? new Date(dateFrom).getTime() : null;
      const tierById = tier ? computeRewardTiers() : null;
      const filtered = JOBS.filter((j) => {
        if (status === "open" && !j.isOpen) return false;
        if (q && !(j.title + " " + j.description + " " + j.location).toLowerCase().includes(q)) return false;
        if (loc && !j.location.toLowerCase().includes(loc)) return false;
        if (tierById && tierById[j.id] !== tier) return false;
        if (dateFromTime !== null) {
          if (!j.workDate) return false;
          const jobTime = new Date(j.workDate).getTime();
          if (isNaN(jobTime) || jobTime < dateFromTime) return false;
        }
        return true;
      }).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      resultEl.textContent = LANG === "en"
        ? `${filtered.length} of ${JOBS.length} jobs`
        : `${JOBS.length}件中 ${filtered.length}件を表示`;

      const listEl = document.getElementById("job-list");
      // 求人5件おきに広告バナーを1枠差し込む(ただし一覧の最後には付けない)。
      const AD_INTERVAL = 5;
      listEl.innerHTML = filtered.length
        ? filtered.map((j, i) => {
            const showAd = (i + 1) % AD_INTERVAL === 0 && i !== filtered.length - 1;
            return jobCardHtml(j) + (showAd ? adBannerHtml() : "");
          }).join("")
        : JOBS.length
          ? `<div class="empty">${tr("該当する求人が見つかりません。条件を変えてみてください。")}</div>`
          : `<div class="empty">${tr("まだ求人がありません。最初の求人を投稿してみましょう。")}</div>`;
    }

    // 文字入力は打つたびに走らせず、少し待ってからまとめて反映する。
    let typingTimer = null;
    const onType = () => {
      clearTimeout(typingTimer);
      typingTimer = setTimeout(renderList, 220);
    };
    qEl.addEventListener("input", onType);
    locEl.addEventListener("input", onType);
    [dateEl, tierEl, statusEl].forEach((el) => el.addEventListener("change", renderList));

    renderList();
  }

    root.innerHTML = `
      <div class="page-head">
        <h1>${tr("求人を投稿する")}</h1>
        <div class="sub">${tr("ログイン不要・匿名のまま投稿できます。報酬の受け渡しは、採用が決まったあと当事者同士で直接行ってください。")}</div>
      </div>
      <form id="post-form" class="card stack">
        <div class="field">
          <label for="f-title">${tr("求人タイトル")}</label>
          <input id="f-title" required placeholder="${tr("例: Solidityスマートコントラクトエンジニア")}" />
        </div>
        <div class="field">

          <textarea id="f-desc" placeholder="${tr("業務内容、必要スキル、稼働形態など")}"></textarea>

        </div>
        <div class="field">

            <button type="button" class="btn-ghost btn-small" id="image-remove-btn">${tr("画像を削除")}</button>
          </div>
          <div style="font-size:11.5px; color:var(--text-dim); margin-top:6px;">${tr("現場の写真やイメージ画像などを1枚添付できます(自動的に縮小・圧縮されます)。")}</div>
        </div>
        <div class="field">
          <label for="f-reward">${LANG === "en" ? "Reward (JPY)" : "採用報酬 (円)"}</label>
          <input id="f-reward" type="number" min="0" step="100" value="15000" />
        </div>
        <div class="payment-note">${tr("このサイトは求人の掲載と連絡の場です。報酬のやり取りには一切関与しません。支払いの方法・タイミングは、採用が決まったあとチャットで直接決めてください。")}</div>

          <button type="submit" class="btn-accent" id="post-submit-btn">${tr("求人を投稿する")}</button>
        </div>
      </form>

    const rewardInput = document.getElementById("f-reward");

    let selectedImageDataUrl = "";
    const imageInput = document.getElementById("f-image");
    const imagePreviewWrap = document.getElementById("image-preview-wrap");
    const imagePreviewImg = document.getElementById("image-preview-img");
    imageInput.addEventListener("change", async () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        toast(tr("画像ファイルを選択してください。"), "error");
        imageInput.value = "";
        return;
      }
      try {
        selectedImageDataUrl = await resizeImageForStorage(file);
        imagePreviewImg.src = selectedImageDataUrl;
        imagePreviewWrap.hidden = false;
      } catch (err) {
        toast((err && err.message) || tr("画像の読み込みに失敗しました。"), "error");
        imageInput.value = "";
      }
    });
    document.getElementById("image-remove-btn").addEventListener("click", () => {
      selectedImageDataUrl = "";
      imageInput.value = "";
      imagePreviewWrap.hidden = true;
    });

    document.getElementById("post-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("f-title").value.trim();
      if (!title) { toast(tr("求人タイトルを入力してください。"), "error"); return; }
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      try {
        const job = await postJob({
          title,
          description: document.getElementById("f-desc").value.trim(),
          location: document.getElementById("f-loc").value.trim(),
          workDate: document.getElementById("f-workdate").value,
          reward: Number(rewardInput.value || 0),
          image: selectedImageDataUrl,
        });
        toast(tr("求人を投稿しました。"), "success");
        renderShell();
        location.hash = "#job-" + job.id;
      } catch (err) {
        if (submitBtn) submitBtn.disabled = false;
        toast(err.message, "error");
      }
    });
  }

  function chatSectionHtml() {
    return `
      <div class="card">
        <div class="section-title" id="chat-title">${tr("チャット")}</div>
        <div class="chat-shell">
          <div class="chat-log" id="chat-log"></div>
          <div class="chat-compose">
            <input id="chat-input" placeholder="${tr("メッセージを入力…")}" />
            <button class="btn-accent btn-small" id="chat-send">${tr("送信")}</button>
          </div>
        </div>
      </div>
    `;
  }

  function mountChat(jobId, otherId, otherLabel) {
    document.getElementById("chat-title").textContent = LANG === "en" ? `Chat with ${otherLabel}` : (otherLabel + " とのチャット");
    const key = roomKey(jobId, currentAccountId, otherId);
    const log = document.getElementById("chat-log");

    function renderLog() {
      const msgs = MESSAGES[key] || [];
      log.innerHTML = msgs.length
        ? msgs.map((m) => `
            <div class="bubble ${m.fromId === currentAccountId ? "mine" : "theirs"}">
              ${escapeHtml(m.text)}
              <time>${fmtDate(m.at)}</time>
            </div>
          `).join("")
        : `<div class="chat-empty">${tr("まだメッセージはありません。最初のメッセージを送ってみましょう。")}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    async function send() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      try {
        await sendMessage(jobId, otherId, text);
        renderLog();
      } catch (err) {
        input.value = text;
        toast((err && err.message) || tr("送信に失敗しました。"), "error");
      }
    }

    document.getElementById("chat-send").addEventListener("click", send);
    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
    renderLog();
  }

  function viewJob(jobId) {
    const root = document.getElementById("view-root");
    const job = getJob(jobId);
    if (!job) {
      root.innerHTML = `<a class="back-link" href="#list">${tr("← 求人一覧に戻る")}</a><div class="empty">${tr("求人が見つかりませんでした。")}</div>`;
      return;
    }
    const employer = getAccount(job.employerId);
    const acct = me();
    const iAmEmployer = acct.id === job.employerId;

    root.innerHTML = `
      <a class="back-link" href="#list">${tr("← 求人一覧に戻る")}</a>
      <div class="card" style="margin-bottom:18px;">
        <div class="meta-row" style="margin-bottom:10px;">
          ${job.isOpen ? `<span class="pill open">${tr("募集中")}</span>` : job.hiredId ? `<span class="pill hired">${tr("採用済み")}</span>` : `<span class="pill">${tr("募集終了")}</span>`}
        </div>
        <h1 style="font-size:24px; margin-bottom:10px;">${escapeHtml(job.title)}</h1>
        ${job.image ? `<img class="job-detail-image" src="${job.image}" alt="" />` : ""}
        <div class="meta-row" style="margin-bottom:14px;">
          <span class="meta-item"><span class="meta-label">${tr("勤務地")}</span>${escapeHtml(job.location) || "-"}</span>
          ${job.workDate ? `<span class="meta-item"><span class="meta-label">${tr("勤務日時")}</span>${fmtWorkDatetime(job.workDate)}</span>` : ""}
          <span class="meta-item"><span class="meta-label">${tr("報酬")}</span><span class="mono">${fmtAmount(job.reward)}</span></span>
          <span class="meta-item"><span class="meta-label">${tr("投稿日")}</span>${fmtDate(job.createdAt)}</span>
        </div>
        <p style="white-space:pre-wrap; line-height:1.75; font-size:14.5px;">${escapeHtml(job.description) || tr("(詳細説明なし)")}</p>
        <div style="margin-top:12px; font-size:12.5px; color:var(--text-dim);">
          ${tr("投稿者")}: ${escapeHtml(employer.name)} <span class="addr-chip">${shortAddr(employer.address)}</span>${ratingBadgeHtml(employer.id)}
        </div>
        ${job.hiredId ? `<div style="margin-top:8px; font-size:13px; color:var(--teal);">${tr("採用者")}: ${escapeHtml(getAccount(job.hiredId).name)}${ratingBadgeHtml(job.hiredId)}</div>` : ""}
      </div>
      <div id="actions" style="margin-bottom:18px;"></div>
      <div id="chat-container"></div>
      <div id="review-section"></div>
    `;

    const actionsEl = document.getElementById("actions");
    const chatContainer = document.getElementById("chat-container");

    if (iAmEmployer) {
      actionsEl.innerHTML = `
        ${(() => {
          if (!job.hiredId) return "";
          const hiredAcct = getAccount(job.hiredId);
          return `
            <div class="card" style="margin-bottom:12px; border-color: color-mix(in srgb, var(--accent) 45%, var(--border));">
              <div class="section-title">${tr("報酬の受け渡し")}</div>
              <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:12px;">${LANG === "en"
                ? `Arrange the payment of ${fmtAmount(job.reward)} directly with ${escapeHtml(hiredAcct.name)} via chat. This site only lists jobs and is not involved in the payment itself.`
                : `報酬 ${fmtAmount(job.reward)} の受け渡し方法・タイミングは、${escapeHtml(hiredAcct.name)}さんとチャットで直接決めてください。このサイトは掲載の場であり、支払いには関与しません。`}</p>
              <button class="btn-accent btn-small chat-with" data-id="${job.hiredId}" data-name="${escapeHtml(hiredAcct.name)}">${tr("チャットを開く")}</button>
            </div>
          `;
        })()}
        <div class="card">
          <div class="section-title">${LANG === "en" ? `Applicants (${job.applicants.length})` : `応募者一覧 (${job.applicants.length}名)`}</div>
          ${job.applicants.length ? job.applicants.map((a) => {
            const applicant = getAccount(a.accountId);
            const hired = job.hiredId === a.accountId;
            return `
              <div class="applicant-row" data-applicant="${a.accountId}">
                <div>
                  <div class="name">${escapeHtml(applicant.name)} ${hired ? `<span class="pill hired">${tr("採用済み")}</span>` : ""}</div>
                  <div class="skills">${escapeHtml(applicant.skills) || tr("スキル未登録")} ・ ${tr("応募日時")} ${fmtDate(a.appliedAt)}</div>
                </div>
                <div class="actions">
                  <button class="btn-ghost btn-small chat-with" data-id="${a.accountId}" data-name="${escapeHtml(applicant.name)}">${tr("チャット")}</button>
                  ${job.isOpen ? `<button class="btn-accent btn-small hire-btn" data-id="${a.accountId}" data-name="${escapeHtml(applicant.name)}">${tr("採用する")}</button>` : ""}
                </div>
              </div>
            `;
          }).join("") : `<div class="empty">${tr("まだ応募はありません。")}</div>`}
          ${job.isOpen ? `<div style="margin-top:16px;"><button class="btn-danger btn-small" id="close-btn">${tr("応募を締め切る(誰も採用しない)")}</button></div>` : ""}
        </div>
      `;
      actionsEl.querySelectorAll(".hire-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const rewardText = fmtAmount(job.reward);
          const msg = LANG === "en"
            ? `Hire ${btn.dataset.name}? The reward of ${rewardText} is paid directly between the two of you — this site is not involved.`
            : `${btn.dataset.name} を採用しますか?報酬 ${rewardText} の受け渡しは当事者同士で直接行ってください(このサイトは関与しません)。`;
          askConfirm(msg, async () => {
            try {
              await hireApplicant(job.id, btn.dataset.id);
              toast(tr("採用しました。"), "success");
              viewJob(jobId);
            } catch (err) { toast(err.message, "error"); }
          });
        });
      });

      actionsEl.querySelectorAll(".chat-with").forEach((btn) => {
        btn.addEventListener("click", () => {
          chatContainer.innerHTML = chatSectionHtml();
          mountChat(job.id, btn.dataset.id, btn.dataset.name);
        });
      });

      const closeBtn = document.getElementById("close-btn");
      if (closeBtn) {
        closeBtn.addEventListener("click", () => {
          const msg = LANG === "en"
            ? `Are you sure you want to close applications for this job?`
            : `本当にこの求人の募集を締め切りますか?`;
          askConfirm(msg, async () => {
            try {
              await closeJob(job.id);
              toast(tr("募集を締め切りました。"), "success");
              viewJob(jobId);
            } catch (err) { toast(err.message, "error"); }
          });
        });
      }
    } else {
      const applied = job.applicants.some((a) => a.accountId === acct.id);
      if (applied && job.hiredId === acct.id) {
        const rewardText = fmtAmount(job.reward);
        actionsEl.innerHTML = `
          <div class="card" style="border-color: color-mix(in srgb, var(--accent) 45%, var(--border));">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
              <span class="pill hired" style="font-size:14px; padding:6px 14px;">🎉 ${tr("採用されました")}</span>
            </div>
            <p style="font-size:14px; line-height:1.7;">${LANG === "en"
              ? `The reward <span class="mono">${rewardText}</span> is arranged directly between you and the job poster. Discuss how and when you'll be paid via chat. This site only lists jobs and is not involved in the payment itself.`
              : `報酬 <span class="mono">${rewardText}</span> の受け渡しは、投稿者と直接のやり取りになります。支払いの方法・タイミングはチャットで相談してください。このサイトは掲載の場であり、支払いには関与しません。`}</p>
          </div>
        `;
        chatContainer.innerHTML = chatSectionHtml();
        mountChat(job.id, job.employerId, employer.name);
      } else if (applied && job.hiredId && job.hiredId !== acct.id) {
        actionsEl.innerHTML = `
          <div class="card"><span class="pill">${tr("不採用")}</span> ${tr("今回は他の応募者が採用されました。またの機会にご応募ください。")}</div>
        `;
      } else if (applied && !job.isOpen && !job.hiredId) {
        // 投稿者が誰も採用せずに「応募を締め切る」でキャンセルした求人。
        // マイページの応募一覧からはすでに除外しているが、求人ページへ
        // 直接アクセスされた場合のために、正確な状態を表示しておく。
        actionsEl.innerHTML = `
          <div class="card"><span class="pill">${tr("募集終了")}</span> ${tr("投稿者がこの求人の募集を締め切りました。今回は不採用となります。")}</div>
        `;
      } else if (applied) {
        actionsEl.innerHTML = `
          <div class="card"><span class="pill open">${tr("応募済み")}</span> ${tr("選考結果をお待ちください。下のチャットから投稿者に連絡できます。")}</div>
        `;
        chatContainer.innerHTML = chatSectionHtml();
        mountChat(job.id, job.employerId, employer.name);
      } else if (!job.isOpen) {
        actionsEl.innerHTML = `<div class="empty">${tr("この求人の募集は終了しています。")}</div>`;
      } else {
        actionsEl.innerHTML = `
          <div class="card">
            <div class="section-title">${tr("この求人に応募する")}</div>
            <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:14px;">${tr("応募は無料です。まずは匿名のまま応募できます。")}</p>
            <button class="btn-accent" id="apply-btn">${tr("応募する")}</button>
          </div>
        `;
        document.getElementById("apply-btn").addEventListener("click", async () => {
          try {
            await applyToJob(job.id);
            toast(tr("応募しました。"), "success");
            renderShell();
            viewJob(jobId);
          } catch (err) { toast(err.message, "error"); }
        });
      }
    }

    renderReviewSection(job);
  }


  function viewDashboard() {
    const root = document.getElementById("view-root");
    const acct = me();
    const posted = JOBS.filter((j) => j.employerId === acct.id);
    // 投稿者が誰も採用せずに「応募を締め切る」で
    // 締め切った(=キャンセルした)求人は、応募者側のこの一覧からは消す。
    // (誰かが採用されて締め切られた場合は、不採用の記録として引き続き表示する。)
    const applied = JOBS.filter((j) => j.applicants.some((a) => a.accountId === acct.id) && !(!j.isOpen && !j.hiredId));
    function jobRow(job, extra) {
      return `
        <a class="job-card ${job.isOpen ? "" : "is-closed"}" href="#job-${job.id}" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <div>
            <div class="title" style="font-size:15px;">${escapeHtml(job.title)}</div>
            <div class="meta-row">
              ${job.isOpen ? `<span class="pill open">${tr("募集中")}</span>` : job.hiredId ? `<span class="pill hired">${tr("採用済み")}</span>` : `<span class="pill">${tr("募集終了")}</span>`}
              <span class="meta-item"><span class="mono">${fmtAmount(job.reward)}</span></span>
            </div>
          </div>
          <div>${extra || ""}</div>
        </a>
      `;
    }

    root.innerHTML = `
      <div class="page-head">
        <h1>${tr("マイページ")}</h1>
        <div class="sub">${tr("投稿した求人・応募した求人を確認できます。")}</div>
      </div>
      <div style="margin-bottom:24px;">
        <div class="section-title">${LANG === "en" ? `Jobs you posted (${posted.length})` : `自分が投稿した求人 (${posted.length})`}</div>
        <div class="job-list">${posted.length ? posted.map((j) => jobRow(j)).join("") : `<div class="empty">${tr("まだ求人を投稿していません。")}</div>`}</div>
      </div>
      <div style="margin-bottom:28px;">
        <div class="section-title">${LANG === "en" ? `Jobs you applied to (${applied.length})` : `応募者として応募した求人 (${applied.length})`}</div>
        <div class="job-list">${applied.length ? applied.map((j) => jobRow(j, j.hiredId === acct.id ? `<span class="pill hired">${tr("採用されました")}</span>` : "")).join("") : `<div class="empty">${tr("まだ応募していません。")}</div>`}</div>
      </div>
    `;
  }

  function viewProfile() {
    const root = document.getElementById("view-root");
    const acct = me();
    root.innerHTML = `
      <div class="page-head">
        <h1>${tr("プロフィール")}</h1>
        <div class="sub">${tr("名前やスキル、投稿した求人は、このアカウントIDに紐づいて保存されます。")}</div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div style="font-size:12.5px; color:var(--text-dim);">${tr("アカウントID")}</div>
        <div class="addr-chip" style="margin-top:6px; display:inline-block;">${acct.address}</div>
        <div style="margin-top:10px; font-size:12.5px; color:var(--text-dim);">${tr("あなたの評価")}: ${(() => {
          const stats = accountRatingStats(acct.id);
          return stats ? `★${stats.avg.toFixed(1)} (${stats.count})` : tr("まだ評価がありません");
        })()}</div>
      </div>
      <form id="profile-form" class="card stack">
        <div class="field">
          <label for="p-role">${tr("表示ラベル(任意)")}</label>
          <select id="p-role">
            <option value="" ${!acct.role ? "selected" : ""}>${tr("特に設定しない")}</option>
            <option value="applicant" ${acct.role === "applicant" ? "selected" : ""}>${tr("応募者(求職者)")}</option>
            <option value="employer" ${acct.role === "employer" ? "selected" : ""}>${tr("投稿者(採用側)")}</option>
          </select>
          <div style="font-size:11.5px; color:var(--text-dim); margin-top:6px;">${tr("これは表示用のラベルだけで、選ばなくても・どちらを選んでも、求人の投稿と応募はどちらも同じアカウントでできます。")}</div>
        </div>
        <div class="field">
          <label for="p-name">${tr("名前 / 屋号など")}</label>
          <input id="p-name" value="${escapeHtml(acct.name)}" ${acct.isGuest ? "readonly disabled" : ""} />
          ${acct.isGuest ? `
            <div style="font-size:11.5px; color:var(--text-dim); margin-top:6px;">
              ${tr("匿名ゲストの名前は変更できません。名前を付けて使いたい場合は、右上から新規登録してください(自己紹介とスキルは匿名のままでも書けます)。")}
            </div>
            <button type="button" class="btn-ghost btn-small" id="p-signup-btn" style="margin-top:8px;">${tr("＋ 新規登録(名前を付けて使う)")}</button>
          ` : ""}
        </div>
        <div class="field">
          <label for="p-bio">${tr("自己紹介 / 会社紹介")}</label>
          <textarea id="p-bio">${escapeHtml(acct.bio)}</textarea>
        </div>
        <div class="field">
          <label for="p-skills">${tr("スキル / タグ (カンマ区切り)")}</label>
          <input id="p-skills" value="${escapeHtml(acct.skills)}" placeholder="${tr("例: Solidity, React, Node.js")}" />
        </div>
        <div><button type="submit" class="btn-accent">${tr("保存する")}</button></div>
      </form>
      <div class="card" style="margin-top:16px; border-color:var(--danger, #d33);">
        <div class="section-title" style="font-size:14px; color:var(--danger, #d33);">${tr("アカウントの削除")}</div>
        <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">${tr("このアカウントを削除します。自分が投稿した求人はすべて削除され、この操作は取り消せません。応募した(まだ採用されていない)求人からは応募が取り下げられます。")}${acct.isGuest ? tr("これがあなたの最後のアカウントの場合、削除すると新しい「匿名ゲスト」アカウントが自動的に作られます。") : tr("削除後は匿名ゲストに戻ります。")}</p>
        <button type="button" class="btn-ghost" id="delete-account-btn" style="border-color:var(--danger, #d33); color:var(--danger, #d33);">${tr("このアカウントを削除する")}</button>
      </div>
    `;
    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const role = document.getElementById("p-role").value;
      const bio = document.getElementById("p-bio").value.trim();
      const skills = document.getElementById("p-skills").value.trim();
      // 匿名ゲストの名前は固定。入力欄も無効にしているが、
      // 念のため保存するデータにも名前を含めない。
      const name = acct.isGuest ? acct.name : document.getElementById("p-name").value.trim();
      const patch = acct.isGuest ? { role, bio, skills } : { role, name, bio, skills };
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      try {
        const { doc, updateDoc } = fsMod;
        await updateDoc(doc(db, "accounts", acct.id), patch);
        acct.role = role;
        acct.name = name;
        acct.bio = bio;
        acct.skills = skills;
        toast(tr("保存しました。"), "success");
        renderShell();
      } catch (err) {
        toast((err && err.message) || tr("保存に失敗しました。"), "error");
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    });
    const signupFromProfile = document.getElementById("p-signup-btn");
    if (signupFromProfile) {
      signupFromProfile.addEventListener("click", () => { openSignupModal(); });
    }

    const deleteBtn = document.getElementById("delete-account-btn");
    if (deleteBtn) {
      deleteBtn.addEventListener("click", () => {
        askConfirm(tr("本当にこのアカウントを削除しますか?投稿した求人もすべて削除され、元に戻せません。"), async () => {
          try {
            await deleteAccount(acct.id);
            toast(tr("アカウントを削除しました。"), "success");
            location.hash = "#list";
            route();
          } catch (err) {
            toast((err && err.message) || tr("削除に失敗しました。"), "error");
          }
        });
      });
    }
  }

  function route() {
    document.getElementById("account-panel").hidden = true;
    renderShell();
    const r = currentRoute();
    if (r.name === "list") viewList(r.query);
    else if (r.name === "search") viewSearch(r.query);
    else if (r.name === "post") viewPost();
    else if (r.name === "dashboard") viewDashboard();
    else if (r.name === "profile") viewProfile();
    else if (r.name === "job") viewJob(r.id);
    window.scrollTo(0, 0);
  }

  // 起動時にFirebaseへ匿名サインインし、共有データベースからデータを
  // 読み込み終わるまでは、他のボタン類を動かさず読み込み中の表示にしておく。
  document.getElementById("view-root").innerHTML = `<div class="empty">${tr("読み込み中…")}</div>`;

  // 静的なHTML(<script>の外)にある日本語の文言を、検出した言語に合わせて
  // 上書きする。LANGが"ja"の場合は何もせず、これまでの表示と完全に同じになる。
  function applyStaticTranslations() {
    if (LANG !== "en") return;
    document.title = tr("ヒトテマ | 匿名で使える求人マッチング・単発バイト掲示板");
    const wordmark = document.getElementById("masthead-wordmark");
    if (wordmark) wordmark.textContent = tr("ヒトテマ");
    const navLabels = {
      search: "検索",
      list: "求人一覧",
      post: "求人を投稿",
      dashboard: "マイページ",
      profile: "プロフィール",
    };
    document.querySelectorAll("#nav-tabs a[data-tab]").forEach((a) => {
      const ja = navLabels[a.dataset.tab];
      if (ja) a.textContent = tr(ja);
    });
    const loginLabel = document.querySelector("#account-btn .login-label");
    if (loginLabel) loginLabel.textContent = tr("ログイン");
    const footer = document.querySelector(".site-footer");
    if (footer) {
      footer.textContent = tr("このサイトは求人の掲載と連絡の場です。運営者はお金のやり取りを仲介・保証する登録業者ではなく、報酬の受け渡しには一切関与しません。採用後の支払いは投稿者と応募者の間で直接行われるものです。ご利用は自己責任でお願いします。実際のお金がからむ求人の掲載・応募については、お住まいの地域のルール・法律に沿っているか、ご自身でご確認ください。");
    }
    const fab = document.getElementById("fab-post");
    if (fab) {
      const label = tr("求人を投稿する");
      fab.setAttribute("title", label);
      fab.setAttribute("aria-label", label);
    }
  }

  async function init() {
    try {
      await ensureAuth();
      await fetchAllData();
    } catch (err) {
      document.getElementById("view-root").innerHTML = `
        <div class="empty">
          ${tr("データの読み込みに失敗しました。しばらくしてから再読み込みしてください。")}<br>
          <span style="font-size:11.5px; color:var(--text-dim);">${escapeHtml((err && err.message) || String(err))}</span>
        </div>
      `;
      return;
    }

    applyStaticTranslations();

    document.getElementById("account-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      const panel = document.getElementById("account-panel");
      panel.hidden = !panel.hidden;
      if (!panel.hidden) renderAccountPanel();
    });
    document.addEventListener("click", (e) => {
      const panel = document.getElementById("account-panel");
      if (!panel.hidden && !panel.contains(e.target) && e.target.id !== "account-btn" && !document.getElementById("account-btn").contains(e.target)) {
        panel.hidden = true;
      }
    });

    window.addEventListener("hashchange", route);
    route();
  }

  init();
})();
</script>
</body>
</html>
