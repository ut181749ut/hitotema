                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
                  <div class="section-title" style="margin-bottom:0;">${tr("報酬の支払い")}(${methodLabel})</div>
                  ${statusPill}
                </div>
                <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:12px;">${LANG === "en"
                  ? `Arrange the payment of ${fmtAmount(job.reward, job.payMethod)} directly with ${escapeHtml(hiredAcct.name)} via chat.`
                  : `報酬 ${fmtAmount(job.reward, job.payMethod)} の受け渡し方法・タイミングは、${escapeHtml(hiredAcct.name)}さんとチャットで直接相談してください。`}</p>
                <button class="btn-accent btn-small chat-with" data-id="${job.hiredId}" data-name="${escapeHtml(hiredAcct.name)}">${tr("チャットを開く")}</button>
                ${settleFooterHtml}
              </div>
            `;
          }

          if (job.settled || (!isXmr && !isCard)) return "";

          // カード決済はStripe Connect(アプリ内で完結)でのみ扱う。
          // 以前の「採用者がStripeで決済リンクを発行してURLを貼る」方式は廃止した。
          if (isCard) {
            if (!STRIPE_CONNECT_ENABLED) {
              return `
                <div class="card" style="margin-bottom:12px;">
                  <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
                    <div class="section-title" style="margin-bottom:0;">${tr("報酬の支払い")}</div>
                    ${statusPill}
                  </div>
                  <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:12px;">${tr("カード決済は現在準備中です。お手数ですが、チャットで相手と直接やり取りしてください。")}</p>
                  <button class="btn-accent btn-small chat-with" data-id="${job.hiredId}" data-name="${escapeHtml(hiredAcct.name)}">${tr("チャットを開く")}</button>
                  ${settleFooterHtml}
                </div>
              `;
            }
            if (!hiredAcct.stripeChargesEnabled) {
              return `
                <div class="card" style="margin-bottom:12px; border-color: color-mix(in srgb, var(--accent) 45%, var(--border));">
                  <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
                    <div class="section-title" style="margin-bottom:0;">${tr("報酬の支払い")}</div>
                    ${statusPill}
                  </div>
                  <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:12px;">${LANG === "en"
                    ? `${escapeHtml(hiredAcct.name)} hasn't finished their payout setup yet. Please check with them via chat.`
                    : `採用者(${escapeHtml(hiredAcct.name)})はまだ受け取り設定を完了していません。チャットで確認してください。`}</p>
                  <button class="btn-accent btn-small chat-with" data-id="${job.hiredId}" data-name="${escapeHtml(hiredAcct.name)}">${tr("チャットを開く")}</button>
                </div>
              `;
            }
            return `
              <div class="card" style="margin-bottom:12px; border-color: color-mix(in srgb, var(--accent) 45%, var(--border));">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
                  <div class="section-title" style="margin-bottom:0;">${tr("報酬の支払い")}(${fmtAmount(job.reward, job.payMethod)})</div>
                  ${statusPill}
                </div>
                <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:12px;">${tr("このページ上でカード・Apple Payで支払えます。支払いが完了すると、報酬は自動的に採用者へ送られます。")}</p>
                <button class="btn-accent btn-small" id="pay-now-btn">${tr("支払う")}</button>
              </div>
            `;
          }

          // 以下はMonero決済のみ
          const theirAddress = hiredAcct.moneroAddress;
          if (!theirAddress) {
            return `
              <div class="card" style="margin-bottom:12px; border-color: color-mix(in srgb, var(--accent) 45%, var(--border));">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
                  <div class="section-title" style="margin-bottom:0;">${tr("報酬の支払い")}</div>
                  ${statusPill}
                </div>
                <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:12px;">${LANG === "en"
                  ? `The hired applicant (${escapeHtml(hiredAcct.name)}) hasn't registered a Monero address yet. Please check with them via chat.`
                  : `採用者(${escapeHtml(hiredAcct.name)})はまだMoneroアドレスを登録していません。チャットで確認してください。`}</p>
                <button class="btn-accent btn-small chat-with" data-id="${job.hiredId}" data-name="${escapeHtml(hiredAcct.name)}">${tr("チャットを開く")}</button>
                ${settleFooterHtml}
              </div>
            `;
          }
          const uri = buildMoneroUri({
            address: theirAddress,
            amount: job.reward,
            description: LANG === "en" ? `Reward: ${job.title}` : `報酬: ${job.title}`,
          });
          return paymentLinkCardHtml({
            idPrefix: "reward-pay",
            heading: LANG === "en" ? `Reward payment link (${fmtAmount(job.reward, job.payMethod)})` : `報酬の支払いリンク(${fmtAmount(job.reward, job.payMethod)})`,
            uri,
            note: LANG === "en" ? `Sent to the address the hired applicant (${escapeHtml(hiredAcct.name)}) registered on their dashboard.` : `採用者(${escapeHtml(hiredAcct.name)})がマイページに登録したアドレス宛てです。`,
            walletNote: tr("「ウォレットで開く」はMonero対応ウォレット(Cake Walletなど)がお使いの端末にインストールされていないと反応しません。基本的には「リンクをコピー」してウォレットアプリ側に貼り付けてください。"),
            headerExtra: statusPill,
            footerHtml: settleFooterHtml,
          });
        })()}
        <div class="card">
          <div class="section-title">${LANG === "en" ? `Applicants (${job.applicants.length})` : `応募者一覧 (${job.applicants.length}名)`}</div>
          ${job.applicants.length ? job.applicants.map((a) => {
            const applicant = getAccount(a.accountId);
            const hired = job.hiredId === a.accountId;
            return `
              <div class="applicant-row" data-applicant="${a.accountId}">
                <div>
                  <div class="name">${escapeHtml(applicant.name)} ${hired ? `<span class="pill hired">${tr("採用済み")}</span>` : ""}</div>
                  <div class="skills">${escapeHtml(applicant.skills) || tr("スキル未登録")} ・ ${tr("応募日時")} ${fmtDate(a.appliedAt)}</div>
                </div>
                <div class="actions">
                  <button class="btn-ghost btn-small chat-with" data-id="${a.accountId}" data-name="${escapeHtml(applicant.name)}">${tr("チャット")}</button>
                  ${job.isOpen ? `<button class="btn-accent btn-small hire-btn" data-id="${a.accountId}" data-name="${escapeHtml(applicant.name)}">${tr("採用する")}</button>` : ""}
                  ${hired ? (job.settled
                    ? `<span class="pill settled">${tr("支払い済み")}</span>`
                    : `<span class="pill unsettled">${tr("支払い待ち")}</span>`) : ""}
                </div>
              </div>
            `;
          }).join("") : `<div class="empty">${tr("まだ応募はありません。")}</div>`}
          ${job.isOpen ? `<div style="margin-top:16px;"><button class="btn-danger btn-small" id="close-btn">${tr("応募を締め切る(未採用の場合、報酬は返金されます)")}</button></div>` : ""}
        </div>
      `;
      if (document.getElementById("reward-pay-copy")) wireCopyButton("reward-pay-copy", "reward-pay-uri");

      const payNowBtn = document.getElementById("pay-now-btn");
      if (payNowBtn) {
        payNowBtn.addEventListener("click", () => openPaymentModal(job, acct));
      }

      actionsEl.querySelectorAll(".hire-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const rewardText = fmtAmount(job.reward, job.payMethod);
          const msg = LANG === "en"
            ? `Hire ${btn.dataset.name}? Please pay the reward of ${rewardText} directly${job.payMethod === "xmr" ? " via Monero" : job.payMethod === "card" ? " via card/Apple Pay" : job.payMethod === "cash" ? " in cash, in person" : ""}.`
            : (() => {
              const directPayLabel = job.payMethod === "xmr" ? "Moneroで" : job.payMethod === "card" ? "カード/Apple Payで" : job.payMethod === "cash" ? "手渡しで" : "";
              return `${btn.dataset.name} を採用しますか?報酬 ${rewardText} は${directPayLabel}直接お支払いください。`;
            })();
          askConfirm(msg, async () => {
            try {
              await hireApplicant(job.id, btn.dataset.id);
              toast(tr("採用しました。"), "success");
              viewJob(jobId);
            } catch (err) { toast(err.message, "error"); }
          });
        });
      });

      actionsEl.querySelectorAll(".settle-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          askConfirm(tr("採用者への支払いは完了しましたか?この操作は自己申告であり、実際の送金・手渡しはアプリの外で行われます。"), async () => {
            try {
              await markSettled(job.id);
              toast(tr("支払い済みにしました。"), "success");
              viewJob(jobId);
            } catch (err) { toast(err.message, "error"); }
          });
        });
      });

      actionsEl.querySelectorAll(".chat-with").forEach((btn) => {
        btn.addEventListener("click", () => {
          chatContainer.innerHTML = chatSectionHtml();
          mountChat(job.id, btn.dataset.id, btn.dataset.name);
        });
      });

      const closeBtn = document.getElementById("close-btn");
      if (closeBtn) {
        closeBtn.addEventListener("click", () => {
          const msg = LANG === "en"
            ? `Are you sure you want to close applications for this job?`
            : `本当にこの求人の募集を締め切りますか?`;
          askConfirm(msg, async () => {
            try {
              await closeJob(job.id);
              toast(tr("募集を締め切りました。"), "success");
              viewJob(jobId);
            } catch (err) { toast(err.message, "error"); }
          });
        });
      }
    } else {
      const applied = job.applicants.some((a) => a.accountId === acct.id);
      if (applied && job.hiredId === acct.id) {
        const isCard = job.payMethod === "card";
        const rewardText = fmtAmount(job.reward, job.payMethod);
        const howToGetPaid = LANG === "en"
          ? (job.payMethod === "xmr"
              ? `The reward <span class="mono">${rewardText}</span> will be paid by the job poster to the Monero address you registered on your dashboard. If you haven't registered one yet, please do so on <a href="#dashboard">your dashboard</a> first.`
              : job.payMethod === "card"
                ? `The reward <span class="mono">${rewardText}</span> will be paid by the job poster by card or Apple Pay. Once the payment goes through, Stripe deposits it into the bank account you registered in your payout setup.`
                : `The reward <span class="mono">${rewardText}</span> will be paid in cash, in person. Please discuss the date/time and place via chat.`)
          : (job.payMethod === "xmr"
              ? `報酬 <span class="mono">${rewardText}</span> は、あなたがマイページに登録したMoneroアドレス宛てに投稿者が支払います。アドレスが未登録の場合は<a href="#dashboard">マイページ</a>で先に登録してください。`
              : job.payMethod === "card"
                ? `報酬 <span class="mono">${rewardText}</span> は、投稿者がカード/Apple Payで支払います。支払いが完了すると、Stripeを経由してあなたが受け取り設定で登録した銀行口座に入金されます。`
                : `報酬 <span class="mono">${rewardText}</span> は手渡しでの支払いです。チャットで日時・場所を相談してください。`);
        actionsEl.innerHTML = `
          <div class="card" style="border-color: color-mix(in srgb, var(--accent) 45%, var(--border));">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
              <span class="pill hired" style="font-size:14px; padding:6px 14px;">🎉 ${tr("採用されました")}</span>
              ${job.settled ? `<span class="pill settled">${tr("支払い済み(自己申告)")}</span>` : `<span class="pill unsettled">${tr("支払い待ち")}</span>`}
            </div>
            <p style="font-size:14px; line-height:1.7;">${howToGetPaid}</p>
          </div>
          ${isCard ? `
            <div class="card" style="margin-top:12px;">
              <div class="section-title">${tr("カード決済の受け取り設定")}</div>
              ${acct.stripeChargesEnabled ? `
                <p style="font-size:12.5px; color:var(--text-dim);">
                  <span class="pill settled">${tr("受け取り可能")}</span>
                  ${tr("支払いが完了すると、報酬は自動であなたの銀行口座に振り込まれます。")}
                </p>
              ` : `
                <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:10px;">${tr("まだ受け取り設定が完了していません。設定が済むまで、投稿者は支払いを行えません。")}</p>
                <a href="#dashboard" class="btn-accent btn-small" style="text-decoration:none; display:inline-block;">${tr("マイページで設定する")}</a>
              `}
            </div>
          ` : ""}
        `;
        chatContainer.innerHTML = chatSectionHtml();
        mountChat(job.id, job.employerId, employer.name);
      } else if (applied && job.hiredId && job.hiredId !== acct.id) {
        actionsEl.innerHTML = `
          <div class="card"><span class="pill">${tr("不採用")}</span> ${tr("今回は他の応募者が採用されました。またの機会にご応募ください。")}</div>
        `;
      } else if (applied && !job.isOpen && !job.hiredId) {
        // 投稿者が誰も採用せずに「応募を締め切る」でキャンセルした求人。
        // マイページの応募一覧からはすでに除外しているが、求人ページへ
        // 直接アクセスされた場合のために、正確な状態を表示しておく。
        actionsEl.innerHTML = `
          <div class="card"><span class="pill">${tr("募集終了")}</span> ${tr("投稿者がこの求人の募集を締め切りました。今回は不採用となります。")}</div>
        `;
      } else if (applied) {
        actionsEl.innerHTML = `
          <div class="card"><span class="pill open">${tr("応募済み")}</span> ${tr("選考結果をお待ちください。下のチャットから投稿者に連絡できます。")}</div>
        `;
        chatContainer.innerHTML = chatSectionHtml();
        mountChat(job.id, job.employerId, employer.name);
      } else if (!job.isOpen) {
        actionsEl.innerHTML = `<div class="empty">${tr("この求人の募集は終了しています。")}</div>`;
      } else {
        actionsEl.innerHTML = `
          <div class="card">
            <div class="section-title">${tr("この求人に応募する")}</div>
            <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:14px;">${tr("応募は無料です。まずは匿名のまま応募できます。")}</p>
            <button class="btn-accent" id="apply-btn">${tr("応募する")}</button>
          </div>
        `;
        document.getElementById("apply-btn").addEventListener("click", async () => {
          try {
            await applyToJob(job.id);
            toast(tr("応募しました。"), "success");
            renderShell();
            viewJob(jobId);
          } catch (err) { toast(err.message, "error"); }
        });
      }
    }

    renderReviewSection(job);
  }


  function viewDashboard() {
    const root = document.getElementById("view-root");
    const acct = me();
    const posted = JOBS.filter((j) => j.employerId === acct.id);
    // 投稿者が採用せずに「応募を締め切る(未採用の場合、報酬は返金されます)」で
    // 締め切った(=キャンセルした)求人は、応募者側のこの一覧からは消す。
    // (誰かが採用されて締め切られた場合は、不採用の記録として引き続き表示する。)
    const applied = JOBS.filter((j) => j.applicants.some((a) => a.accountId === acct.id) && !(!j.isOpen && !j.hiredId));
    // 「どこで支払うのか分からない」対策として、支払いがまだの案件を
    // マイページの一番上にまとめて出す。自分が払う側(投稿者)と、
    // 自分が受け取る側(採用された人)は意味が違うので分けて表示する。
    const toPay = posted.filter((j) => j.hiredId && !j.settled);
    const toReceive = applied.filter((j) => j.hiredId === acct.id && !j.settled);

    function jobRow(job, extra) {
      return `
        <a class="job-card ${job.isOpen ? "" : "is-closed"}" href="#job-${job.id}" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <div>
            <div class="title" style="font-size:15px;">${escapeHtml(job.title)}</div>
            <div class="meta-row">
              ${job.isOpen ? `<span class="pill open">${tr("募集中")}</span>` : job.hiredId ? `<span class="pill hired">${tr("採用済み")}</span>` : `<span class="pill">${tr("募集終了")}</span>`}
              ${job.hiredId ? (job.settled ? `<span class="pill settled">${tr("支払い済み")}</span>` : `<span class="pill unsettled">${tr("支払い待ち")}</span>`) : ""}
              ${payMethodPillHtml(job)}
              <span class="meta-item"><span class="mono">${fmtAmount(job.reward, job.payMethod)}</span></span>
            </div>
          </div>
          <div>${extra || ""}</div>
        </a>
      `;
    }

    // 支払い待ちカード内の行。求人カードより一段コンパクトにして、
    // 「この求人の支払い画面へ行く」導線であることをはっきりさせる。
    function pendingRow(job, actionLabel) {
      return `
        <a class="job-card" href="#job-${job.id}" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <div>
            <div class="title" style="font-size:15px;">${escapeHtml(job.title)}</div>
            <div class="meta-row">
              ${payMethodPillHtml(job)}
              <span class="meta-item"><span class="mono">${fmtAmount(job.reward, job.payMethod)}</span></span>
            </div>
          </div>
          <span class="btn-accent btn-small" style="white-space:nowrap; pointer-events:none;">${actionLabel}</span>
        </a>
      `;
    }

    const pendingSectionHtml = (toPay.length || toReceive.length) ? `
      <div class="card" style="margin-bottom:24px; border-color: color-mix(in srgb, var(--accent) 45%, var(--border));">
        ${toPay.length ? `
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap;">
            <div class="section-title" style="margin-bottom:0;">${tr("支払い待ちの求人")}</div>
            <span class="pill unsettled">${toPay.length}</span>
          </div>
          <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">${tr("採用が決まっていて、まだ支払いが済んでいない求人です。タップすると支払い画面が開きます。")}</p>
          <div class="job-list" style="margin-bottom:${toReceive.length ? "18px" : "0"};">${toPay.map((j) => pendingRow(j, tr("支払う"))).join("")}</div>
        ` : ""}
        ${toReceive.length ? `
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap;">
            <div class="section-title" style="margin-bottom:0;">${tr("入金待ちの仕事")}</div>
            <span class="pill unsettled">${toReceive.length}</span>
          </div>
          <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">${tr("あなたが採用され、まだ投稿者からの支払いが済んでいない仕事です。")}</p>
          <div class="job-list">${toReceive.map((j) => pendingRow(j, tr("確認する"))).join("")}</div>
        ` : ""}
      </div>
    ` : "";

    root.innerHTML = `
      <div class="page-head">
        <h1>${tr("マイページ")}</h1>
        <div class="sub">${tr("投稿した求人・応募した求人を確認できます。")}</div>
      </div>
      ${pendingSectionHtml}
      <div style="margin-bottom:24px;">
        <div class="section-title">${LANG === "en" ? `Jobs you posted (${posted.length})` : `自分が投稿した求人 (${posted.length})`}</div>
        <div class="job-list">${posted.length ? posted.map((j) => jobRow(j)).join("") : `<div class="empty">${tr("まだ求人を投稿していません。")}</div>`}</div>
      </div>
      <div style="margin-bottom:28px;">
        <div class="section-title">${LANG === "en" ? `Jobs you applied to (${applied.length})` : `応募者として応募した求人 (${applied.length})`}</div>
        <div class="job-list">${applied.length ? applied.map((j) => jobRow(j, j.hiredId === acct.id ? `<span class="pill hired">${tr("採用されました")}</span>` : "")).join("") : `<div class="empty">${tr("まだ応募していません。")}</div>`}</div>
      </div>
      <div class="card" style="margin-bottom:24px;">
        <div class="section-title">${tr("あなたのMoneroアドレス")}</div>
        <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:14px;">${tr("登録しておくと、Monero決済で求人を投稿するときに自動で入力されます(採用後にチャットで相手に共有する用途にも使えます)。")}</p>
        <form id="monero-form" class="row" style="align-items:flex-end;">
          <div class="field" style="margin-bottom:0;">
            <label for="my-monero">${tr("Moneroアドレス")}</label>
            <input id="my-monero" value="${escapeHtml(acct.moneroAddress || "")}" placeholder="${tr("4で始まる95文字のMoneroアドレス")}" />
          </div>
          <div>
            <button type="submit" class="btn-accent">${tr("保存する")}</button>
          </div>
        </form>
      </div>
      <div class="card">
        <div class="section-title">${tr("カード決済の受け取り設定")}</div>
        ${!STRIPE_CONNECT_ENABLED ? `
          <p style="font-size:12.5px; color:var(--text-dim);">${tr("カード決済は現在準備中です。公開までは手渡しとMoneroがご利用いただけます。")}</p>
        ` : (hasEmailAuth() ? `
          ${acct.stripeChargesEnabled ? `
            <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">
              <span class="pill settled">${tr("受け取り可能")}</span>
              ${tr("本人確認が完了しています。カード決済の求人に採用されると、報酬は自動であなたの銀行口座に振り込まれます。")}
            </p>
            <button type="button" class="btn-ghost btn-small" id="connect-manage-btn">${tr("受け取り情報を確認・変更する")}</button>
          ` : acct.stripeAccountId ? `
            <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">
              <span class="pill unsettled">${tr("設定が未完了")}</span>
              ${tr("本人確認がまだ終わっていません。途中まで入力した内容は保存されているので、続きから再開できます。")}
            </p>
            <button type="button" class="btn-accent btn-small" id="connect-start-btn">${tr("続きから設定する")}</button>
          ` : `
            <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">${tr("カード決済で報酬を受け取るには、一度だけ本人確認が必要です(氏名・住所・生年月日・振込先口座)。Stripeの画面で入力します。2回目以降の仕事では何もする必要はありません。")}</p>
            <button type="button" class="btn-accent btn-small" id="connect-start-btn">${tr("受け取り設定をはじめる")}</button>
          `}
          <div id="connect-embed" style="margin-top:14px;"></div>
        ` : `
          <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">${tr("カード決済で報酬を受け取るには、メールアドレスの登録が必要です。入金待ちのお金がある状態で端末を変えたりデータを消したりすると、登録がないとアカウントに戻れなくなるためです。")}</p>
          <button type="button" class="btn-accent btn-small" id="stripe-email-gate-btn">${tr("メールアドレスを登録")}</button>
        `)}
      </div>
    `;




    document.getElementById("monero-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = document.getElementById("my-monero").value.trim();
      try {
        const { doc, updateDoc } = fsMod;
        await updateDoc(doc(db, "accounts", acct.id), { monero_address: v });
        acct.moneroAddress = v;
        toast(tr("Moneroアドレスを保存しました。"), "success");
      } catch (err) {
        toast((err && err.message) || tr("保存に失敗しました。"), "error");
      }
    });


    const stripeGateBtn = document.getElementById("stripe-email-gate-btn");
    if (stripeGateBtn) {
      stripeGateBtn.addEventListener("click", () => {
        openEmailModal("link", () => { viewDashboard(); });
      });
    }

    // ---- Stripe Connect: 受け取り設定(Expressのオンボーディング) ----
    const connectStartBtn = document.getElementById("connect-start-btn");
    if (connectStartBtn) {
      connectStartBtn.addEventListener("click", async () => {
        connectStartBtn.disabled = true;
        try {
          await startConnectOnboarding(acct);
        } catch (err) {
          toast((err && err.message) || tr("受け取り設定を開始できませんでした。"), "error");
          connectStartBtn.disabled = false;
        }
      });
    }
    const connectManageBtn = document.getElementById("connect-manage-btn");
    if (connectManageBtn) {
      connectManageBtn.addEventListener("click", async () => {
        connectManageBtn.disabled = true;
        try {
          await startConnectOnboarding(acct);
        } catch (err) {
          toast((err && err.message) || tr("受け取り設定を開けませんでした。"), "error");
          connectManageBtn.disabled = false;
        }
      });
    }
    // 設定途中で戻ってきた場合(return_url / refresh_url)、最新状態を取り直す
    if (STRIPE_CONNECT_ENABLED && acct.stripeAccountId && !acct.stripeChargesEnabled) {
      callFn("refreshConnectStatus", { accountId: acct.id })
        .then((res) => {
          if (res && res.ready) {
            acct.stripeChargesEnabled = true;
            viewDashboard();
          }
        })
        .catch(() => { /* 表示を壊さないため黙って無視 */ });
    }
  }

  function viewProfile() {
    const root = document.getElementById("view-root");
    const acct = me();
    root.innerHTML = `
      <div class="page-head">
        <h1>${tr("プロフィール")}</h1>
        <div class="sub">${tr("名前やスキルはウォレットアドレスに紐づけて保存されます(オンチェーンには保存されません)。")}</div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div style="font-size:12.5px; color:var(--text-dim);">${tr("ウォレットアドレス")}</div>
        <div class="addr-chip" style="margin-top:6px; display:inline-block;">${acct.address}</div>
        <div style="margin-top:10px; font-size:12.5px; color:var(--text-dim);">${tr("あなたの評価")}: ${(() => {
          const stats = accountRatingStats(acct.id);
          return stats ? `★${stats.avg.toFixed(1)} (${stats.count})` : tr("まだ評価がありません");
        })()}</div>
      </div>
      <form id="profile-form" class="card stack">
        <div class="field">
          <label for="p-role">${tr("表示ラベル(任意)")}</label>
          <select id="p-role">
            <option value="" ${!acct.role ? "selected" : ""}>${tr("特に設定しない")}</option>
            <option value="applicant" ${acct.role === "applicant" ? "selected" : ""}>${tr("応募者(求職者)")}</option>
            <option value="employer" ${acct.role === "employer" ? "selected" : ""}>${tr("投稿者(採用側)")}</option>
          </select>
          <div style="font-size:11.5px; color:var(--text-dim); margin-top:6px;">${tr("これは表示用のラベルだけで、選ばなくても・どちらを選んでも、求人の投稿と応募はどちらも同じアカウントでできます。")}</div>
        </div>
        <div class="field">
          <label for="p-name">${tr("名前 / 屋号など")}</label>
          <input id="p-name" value="${escapeHtml(acct.name)}" />
        </div>
        <div class="field">
          <label for="p-bio">${tr("自己紹介 / 会社紹介")}</label>
          <textarea id="p-bio">${escapeHtml(acct.bio)}</textarea>
        </div>
        <div class="field">
          <label for="p-skills">${tr("スキル / タグ (カンマ区切り)")}</label>
          <input id="p-skills" value="${escapeHtml(acct.skills)}" placeholder="${tr("例: Solidity, React, Node.js")}" />
        </div>
        <div><button type="submit" class="btn-accent">${tr("保存する")}</button></div>
      </form>
      <div class="card" style="margin-top:16px; border-color:var(--danger, #d33);">
        <div class="section-title" style="font-size:14px; color:var(--danger, #d33);">${tr("アカウントの削除")}</div>
        <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">${tr("このアカウントを削除します。自分が投稿した求人はすべて削除され、この操作は取り消せません。応募した(まだ採用されていない)求人からは応募が取り下げられます。")}${acct.isGuest ? tr("これがあなたの最後のアカウントの場合、削除すると新しい「匿名ゲスト」アカウントが自動的に作られます。") : tr("削除後は匿名ゲストに戻ります。")}</p>
        <button type="button" class="btn-ghost" id="delete-account-btn" style="border-color:var(--danger, #d33); color:var(--danger, #d33);">${tr("このアカウントを削除する")}</button>
      </div>
    `;
    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const role = document.getElementById("p-role").value;
      const name = document.getElementById("p-name").value.trim();
      const bio = document.getElementById("p-bio").value.trim();
      const skills = document.getElementById("p-skills").value.trim();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      try {
        const { doc, updateDoc } = fsMod;
        await updateDoc(doc(db, "accounts", acct.id), { role, name, bio, skills });
        acct.role = role;
        acct.name = name;
        acct.bio = bio;
        acct.skills = skills;
        toast(tr("保存しました。"), "success");
        renderShell();
      } catch (err) {
        toast((err && err.message) || tr("保存に失敗しました。"), "error");
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    });
    const deleteBtn = document.getElementById("delete-account-btn");
    if (deleteBtn) {
      deleteBtn.addEventListener("click", () => {
        askConfirm(tr("本当にこのアカウントを削除しますか?投稿した求人もすべて削除され、元に戻せません。"), async () => {
          try {
            await deleteAccount(acct.id);
            toast(tr("アカウントを削除しました。"), "success");
            location.hash = "#list";
            route();
          } catch (err) {
            toast((err && err.message) || tr("削除に失敗しました。"), "error");
          }
        });
      });
    }
  }

  function route() {
    document.getElementById("account-panel").hidden = true;
    renderShell();
    const r = currentRoute();
    if (r.name === "list") viewList(r.query);
    else if (r.name === "search") viewSearch(r.query);
    else if (r.name === "post") viewPost();
    else if (r.name === "dashboard") viewDashboard();
    else if (r.name === "profile") viewProfile();
    else if (r.name === "job") viewJob(r.id);
    window.scrollTo(0, 0);
  }

  // 起動時にFirebaseへ匿名サインインし、共有データベースからデータを
  // 読み込み終わるまでは、他のボタン類を動かさず読み込み中の表示にしておく。
  document.getElementById("view-root").innerHTML = `<div class="empty">${tr("読み込み中…")}</div>`;

  // 静的なHTML(<script>の外)にある日本語の文言を、検出した言語に合わせて
  // 上書きする。LANGが"ja"の場合は何もせず、これまでの表示と完全に同じになる。
  function applyStaticTranslations() {
    if (LANG !== "en") return;
    document.title = tr("なんでも屋さん | 匿名で使える求人マッチング・単発バイト掲示板");
    const wordmark = document.getElementById("masthead-wordmark");
    if (wordmark) wordmark.textContent = tr("なんでも屋さん");
    const navLabels = {
      search: "検索",
      list: "求人一覧",
      post: "求人を投稿",
      dashboard: "マイページ",
      profile: "プロフィール",
    };
    document.querySelectorAll("#nav-tabs a[data-tab]").forEach((a) => {
      const ja = navLabels[a.dataset.tab];
      if (ja) a.textContent = tr(ja);
    });
    const loginLabel = document.querySelector("#account-btn .login-label");
    if (loginLabel) loginLabel.textContent = tr("ログイン");
    const footer = document.querySelector(".site-footer");
    if (footer) {
      footer.textContent = tr("運営者はお金のやり取りを仲介・保証する登録業者ではありません。採用後の報酬の受け渡し(Monero・カード/Apple Pay・手渡し)は、投稿者と応募者の間で直接行われるものです。ご利用は自己責任でお願いします。送金前には宛先・金額を必ず確認してください。実際のお金がからむ求人の掲載・応募については、お住まいの地域のルール・法律に沿っているか、ご自身でご確認ください。");
    }
    const fab = document.getElementById("fab-post");
    if (fab) {
      const label = tr("求人を投稿する");
      fab.setAttribute("title", label);
      fab.setAttribute("aria-label", label);
    }
  }

  async function init() {
    try {
      await ensureAuth();
      await fetchAllData();
    } catch (err) {
      document.getElementById("view-root").innerHTML = `
        <div class="empty">
          ${tr("データの読み込みに失敗しました。しばらくしてから再読み込みしてください。")}<br>
          <span style="font-size:11.5px; color:var(--text-dim);">${escapeHtml((err && err.message) || String(err))}</span>
        </div>
      `;
      return;
    }

    applyStaticTranslations();

    document.getElementById("account-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      const panel = document.getElementById("account-panel");
      panel.hidden = !panel.hidden;
      if (!panel.hidden) renderAccountPanel();
    });
    document.addEventListener("click", (e) => {
      const panel = document.getElementById("account-panel");
      if (!panel.hidden && !panel.contains(e.target) && e.target.id !== "account-btn" && !document.getElementById("account-btn").contains(e.target)) {
        panel.hidden = true;
      }
    });

    window.addEventListener("hashchange", route);
    route();
  }

  init();
})();
</script>
</body>
</html>
