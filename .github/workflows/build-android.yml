name: Build Android app (AAB)

# 手動で実行する。実行するたびに versionCode が1つ増えるので、
# Google Play に同じ番号で拒否されることがない。
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "表示用のバージョン(例 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java を用意
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK を用意
        uses: android-actions/setup-android@v3

      # www/ はサイト本体(index.html)と画像をそのまま使う。
      # アプリ専用の差分(下タブなど)は app/www/index.html 側に入っている。
      - name: Capacitor の作業フォルダを用意
        run: |
          mkdir -p build-app/www
          cp -r app/www/. build-app/www/
          cp app/capacitor.config.json build-app/capacitor.config.json
          cp app/package.json build-app/package.json
          cp -r android-res build-app/android-res
          cp -r scripts build-app/scripts

      - name: 依存関係をインストール
        working-directory: build-app
        run: npm install --no-audit --no-fund

      - name: Android プロジェクトを生成
        working-directory: build-app
        run: |
          npx cap add android
          npx cap sync android

      - name: ヒトテマ用の設定を反映(アプリ名・アイコン・バージョン)
        working-directory: build-app
        run: node scripts/android-setup.mjs "${{ github.run_number }}" "${{ inputs.versionName }}"

      - name: 署名鍵を書き出す
        working-directory: build-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 が設定されていません。READMEの手順で登録してください。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/hitotema.keystore

      - name: 署名付き AAB をビルド
        working-directory: build-app/android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/hitotema.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 署名鍵を消す
        if: always()
        run: rm -f build-app/android/app/hitotema.keystore

      - name: AAB を受け取る
        uses: actions/upload-artifact@v4
        with:
          name: hitotema-${{ inputs.versionName }}-${{ github.run_number }}
          path: build-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
